<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shakwa | Register</title>

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- STYLES -->
  <link rel="stylesheet" href="style.css" />

  <!-- REACT -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <!-- Icons are self-contained SVG in shared.js — no external library needed -->

  <!--
    CLOUDFLARE TURNSTILE — Bot protection widget (Step 4 of registration)
    ═══════════════════════════════════════════════════════════════════════
    HOW IT WORKS (Frontend):
      1. This script loads window.turnstile globally
      2. Step4Review component in pages.js calls window.turnstile.render(container, { sitekey, callback })
      3. User completes the challenge — callback receives a one-time token
      4. Token is included in POST /api/register body as: { turnstile_token: "..." }

    HOW IT WORKS (Backend — Python/FastAPI):
      import httpx
      async def verify_turnstile(token: str) -> bool:
          async with httpx.AsyncClient() as client:
              r = await client.post(
                  "https://challenges.cloudflare.com/turnstile/v0/siteverify",
                  data={"secret": os.getenv("CF_TURNSTILE_SECRET"), "response": token}
              )
          return r.json().get("success", False)

    KEYS (get from https://dash.cloudflare.com → Turnstile):
      Site Key   → paste into Step4Review sitekey param in pages.js  (public)
      Secret Key → store in .env as CF_TURNSTILE_SECRET              (private, backend only)

    TEST KEYS (local dev — always pass):
      Site Key:   1x00000000000000000000AA
      Secret Key: 1x0000000000000000000000000000000AA
  -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <!-- Face detection for Step 4 (selfie auto-capture) — loads faceapi global -->
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
  <!-- OCR for Step 2 (ID card text extraction → auto-fill name/ID) — optional -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>
<body data-page="register">
  <div id="root"></div>
  <!--
    SCRIPT LOAD ORDER (do not change):
      1. shared.js — Icon, COMPLAINTS_DATA, getSentiment, Navbar, useLang, pageHref
      2. pages.js  — All page components + mountPage() which reads data-page attribute

    BACKEND AUTH NOTE:
      After real backend integration:
        - POST /api/register  → returns { user_id, jwt_token }
        - Store JWT in httpOnly cookie (never localStorage — XSS risk)
        - All authenticated pages check JWT validity on mount
        - Redirect to /register if token is missing or expired
  -->
  <script type="text/babel" src="shared.js"></script>
  <script type="text/babel" src="pages.js"></script>
</body>
</html>
