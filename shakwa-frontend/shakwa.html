<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>شكوى | Shakwa — صوتك مسموع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<!-- Face detection for Step 4 -->
<script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
<!-- OCR for ID card text extraction -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<!-- Cloudflare Turnstile -->
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
:root {
  --nile: #1B6B93;
  --nile-dark: #0d4a6b;
  --nile-light: #2a8ab8;
  --gold: #D4AF37;
  --gold-light: #e8c84a;
  --sand: #F5E8C7;
  --papyrus: #F9F5EB;
  --green: #2E8B57;
  --green-light: #3aad6c;
  --pink: #E6A8D7;
  --dark: #0F172A;
  --dark2: #1E293B;
  --dark3: #2d3d52;
  --text-dark: #1a2634;
  --text-mid: #4a6275;
  --red: #DC2626;
  --shadow-gold: 0 8px 32px rgba(212,175,55,0.25);
  --shadow-nile: 0 8px 32px rgba(27,107,147,0.25);
  --shadow-card: 0 4px 24px rgba(0,0,0,0.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Cairo', sans-serif;
  background: var(--papyrus);
  color: var(--text-dark);
  overflow-x: hidden;
}
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--sand); }
::-webkit-scrollbar-thumb { background: var(--nile); border-radius: 3px; }

@keyframes fadeUp { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes borderGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(212,175,55,0); } 50% { box-shadow: 0 0 0 4px rgba(212,175,55,0.3); } }
@keyframes stepPop { from { opacity:0; transform: scale(0.8); } to { opacity:1; transform: scale(1); } }
@keyframes notifSlide { from { opacity:0; transform: translateX(100px); } to { opacity:1; transform: translateX(0); } }
@keyframes kanbanPulse { 0%,100% { box-shadow: var(--shadow-card); } 50% { box-shadow: 0 8px 32px rgba(27,107,147,0.2); } }

.fade-up { animation: fadeUp 0.6s cubic-bezier(.22,.68,0,1.2) both; }
.fade-in { animation: fadeIn 0.5s ease both; }

.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(15,23,42,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(212,175,55,0.15);
  padding: 0 2rem;
  height: 68px;
  display: flex; align-items: center; justify-content: space-between;
  transition: all 0.3s;
}
.navbar-brand {
  font-size: 1.6rem; font-weight: 900; color: var(--gold);
  letter-spacing: -0.5px; cursor: pointer;
  display: flex; align-items: center; gap: 0.5rem;
}
.navbar-brand span { color: #fff; font-weight: 300; font-size: 1rem; }
.nav-links { display: flex; align-items: center; gap: 0.5rem; }
.nav-btn {
  padding: 0.45rem 1.1rem; border-radius: 8px; border: none;
  font-family: 'Cairo', sans-serif; font-size: 0.88rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.nav-btn.ghost { background: transparent; color: #ccc; }
.nav-btn.ghost:hover { color: #fff; background: rgba(255,255,255,0.08); }
.nav-btn.primary { background: var(--gold); color: var(--dark); }
.nav-btn.primary:hover { background: var(--gold-light); transform: translateY(-1px); }
.nav-btn.outline { background: transparent; color: var(--nile-light); border: 1px solid var(--nile-light); }
.nav-btn.outline:hover { background: var(--nile); color: #fff; }
.lang-toggle {
  padding: 0.35rem 0.9rem; border-radius: 20px;
  background: rgba(27,107,147,0.2); color: var(--nile-light);
  border: 1px solid rgba(27,107,147,0.4);
  font-family: 'Cairo', sans-serif; font-size: 0.82rem; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
}
.lang-toggle:hover { background: var(--nile); color: #fff; }

.hero {
  min-height: 100vh;
  background: linear-gradient(135deg, #0d1b2a 0%, #0F172A 40%, #1a2f45 70%, #0d2e1e 100%);
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; padding: 7rem 2rem 4rem;
  position: relative; overflow: hidden;
}
.hero-pattern {
  position: absolute; inset: 0; opacity: 0.04;
  background-image: repeating-linear-gradient(45deg, var(--gold) 0, var(--gold) 1px, transparent 0, transparent 50%);
  background-size: 24px 24px;
}
.hero-glow {
  position: absolute; width: 600px; height: 600px; border-radius: 50%;
  background: radial-gradient(circle, rgba(27,107,147,0.18) 0%, transparent 70%);
  top: 50%; left: 50%; transform: translate(-50%,-50%);
  pointer-events: none;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: rgba(212,175,55,0.12); border: 1px solid rgba(212,175,55,0.3);
  color: var(--gold); padding: 0.4rem 1.2rem; border-radius: 30px;
  font-size: 0.82rem; font-weight: 600; margin-bottom: 1.8rem;
  animation: fadeUp 0.5s ease both;
}
.hero-title {
  font-size: clamp(2.4rem, 6vw, 4.2rem);
  font-weight: 900; color: #fff; line-height: 1.15;
  margin-bottom: 1.2rem;
  animation: fadeUp 0.6s 0.1s ease both;
}
.hero-title .gold { color: var(--gold); }
.hero-title .nile { color: var(--nile-light); }
.hero-sub {
  font-size: 1.1rem; color: #94a3b8; max-width: 560px;
  line-height: 1.8; margin-bottom: 2.4rem;
  animation: fadeUp 0.6s 0.2s ease both;
}
.hero-cta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; animation: fadeUp 0.6s 0.3s ease both; }
.btn-gold {
  padding: 0.9rem 2.2rem; background: var(--gold); color: var(--dark);
  border: none; border-radius: 12px; font-family: 'Cairo', sans-serif;
  font-size: 1rem; font-weight: 800; cursor: pointer;
  transition: all 0.25s; box-shadow: var(--shadow-gold);
}
.btn-gold:hover { background: var(--gold-light); transform: translateY(-2px); box-shadow: 0 12px 40px rgba(212,175,55,0.4); }
.btn-ghost-white {
  padding: 0.9rem 2.2rem; background: rgba(255,255,255,0.07);
  color: #fff; border: 1px solid rgba(255,255,255,0.2);
  border-radius: 12px; font-family: 'Cairo', sans-serif;
  font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.25s;
}
.btn-ghost-white:hover { background: rgba(255,255,255,0.13); transform: translateY(-2px); }

.stats-bar {
  margin-top: 4rem;
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: rgba(255,255,255,0.08);
  border-radius: 16px; overflow: hidden;
  width: 100%; max-width: 640px;
  animation: fadeUp 0.6s 0.4s ease both;
}
.stat-item {
  background: rgba(255,255,255,0.04);
  padding: 1.4rem 1rem; text-align: center;
}
.stat-num { font-size: 1.8rem; font-weight: 900; color: var(--gold); }
.stat-label { font-size: 0.78rem; color: #64748b; margin-top: 0.2rem; }

.float-icon {
  position: absolute; font-size: 2rem; opacity: 0.08;
  animation: float 4s ease-in-out infinite;
  pointer-events: none;
}

.section { padding: 5rem 2rem; }
.section-tag {
  display: inline-block; background: rgba(27,107,147,0.1);
  color: var(--nile); padding: 0.3rem 1rem; border-radius: 20px;
  font-size: 0.8rem; font-weight: 700; margin-bottom: 0.8rem;
  border: 1px solid rgba(27,107,147,0.2);
}
.section-title { font-size: clamp(1.6rem, 3.5vw, 2.4rem); font-weight: 900; color: var(--text-dark); margin-bottom: 0.6rem; }
.section-sub { color: var(--text-mid); font-size: 1rem; line-height: 1.8; max-width: 560px; }

.features-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem; margin-top: 3rem;
}
.feature-card {
  background: #fff; border-radius: 16px; padding: 1.8rem;
  border: 1px solid rgba(0,0,0,0.06);
  transition: all 0.3s; cursor: default;
  position: relative; overflow: hidden;
}
.feature-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--nile), var(--gold));
  transform: scaleX(0); transform-origin: left; transition: transform 0.3s;
}
.feature-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-card); }
.feature-card:hover::before { transform: scaleX(1); }
.feature-icon { font-size: 2rem; margin-bottom: 1rem; }
.feature-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.5rem; }
.feature-desc { font-size: 0.85rem; color: var(--text-mid); line-height: 1.7; }

.page { padding-top: 68px; min-height: 100vh; }

.form-card {
  background: #fff; border-radius: 20px; padding: 2.5rem;
  box-shadow: var(--shadow-card); border: 1px solid rgba(0,0,0,0.06);
}
.form-label { font-size: 0.85rem; font-weight: 700; color: var(--text-dark); margin-bottom: 0.5rem; display: block; }
.form-input {
  width: 100%; padding: 0.75rem 1rem; border-radius: 10px;
  border: 1.5px solid #e2e8f0; font-family: 'Cairo', sans-serif;
  font-size: 0.95rem; transition: all 0.2s; background: var(--papyrus);
  outline: none; color: var(--text-dark);
}
.form-input:focus { border-color: var(--nile); background: #fff; box-shadow: 0 0 0 3px rgba(27,107,147,0.1); }
.form-input::placeholder { color: #94a3b8; }
.form-input.error { border-color: var(--red); }
.form-select {
  width: 100%; padding: 0.75rem 1rem; border-radius: 10px;
  border: 1.5px solid #e2e8f0; font-family: 'Cairo', sans-serif;
  font-size: 0.95rem; background: var(--papyrus); color: var(--text-dark);
  outline: none; cursor: pointer; transition: all 0.2s;
  appearance: none;
}
.form-select:focus { border-color: var(--nile); box-shadow: 0 0 0 3px rgba(27,107,147,0.1); }
.form-textarea {
  width: 100%; padding: 0.75rem 1rem; border-radius: 10px;
  border: 1.5px solid #e2e8f0; font-family: 'Cairo', sans-serif;
  font-size: 0.95rem; resize: vertical; min-height: 120px;
  background: var(--papyrus); color: var(--text-dark); outline: none; transition: all 0.2s;
}
.form-textarea:focus { border-color: var(--nile); background: #fff; box-shadow: 0 0 0 3px rgba(27,107,147,0.1); }

.steps-bar { display: flex; align-items: center; gap: 0; margin-bottom: 2.5rem; }
.step-dot {
  width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 0.85rem; transition: all 0.3s; flex-shrink: 0;
}
.step-dot.done { background: var(--green); color: #fff; }
.step-dot.active { background: var(--nile); color: #fff; animation: borderGlow 2s ease infinite; }
.step-dot.pending { background: #e2e8f0; color: #94a3b8; }
.step-line { flex: 1; height: 2px; background: #e2e8f0; transition: all 0.3s; }
.step-line.done { background: var(--green); }

.upload-zone {
  border: 2px dashed #cbd5e1; border-radius: 14px; padding: 2rem;
  text-align: center; cursor: pointer; transition: all 0.2s; background: var(--papyrus);
}
.upload-zone:hover { border-color: var(--nile); background: rgba(27,107,147,0.03); }
.upload-zone.drag { border-color: var(--gold); background: rgba(212,175,55,0.04); }

.alert {
  padding: 0.9rem 1.2rem; border-radius: 10px; font-size: 0.88rem;
  font-weight: 600; margin-bottom: 1rem; display: flex; align-items: flex-start; gap: 0.6rem;
}
.alert-info { background: rgba(27,107,147,0.08); color: var(--nile); border: 1px solid rgba(27,107,147,0.2); }
.alert-success { background: rgba(46,139,87,0.08); color: var(--green); border: 1px solid rgba(46,139,87,0.2); }
.alert-warning { background: rgba(212,175,55,0.08); color: #b07d0f; border: 1px solid rgba(212,175,55,0.2); }

.checkbox-wrap { display: flex; align-items: flex-start; gap: 0.7rem; cursor: pointer; }
.checkbox-input { width: 18px; height: 18px; accent-color: var(--nile); cursor: pointer; flex-shrink: 0; margin-top: 2px; }
.checkbox-text { font-size: 0.88rem; color: var(--text-mid); line-height: 1.6; }

.spinner {
  width: 40px; height: 40px; border: 3px solid rgba(27,107,147,0.2);
  border-top-color: var(--nile); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto;
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
.review-row {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 0.75rem 0; border-bottom: 1px solid #f1f5f9; font-size: 0.88rem;
}
.review-row:last-child { border-bottom: none; }
.review-label { color: var(--text-mid); font-weight: 600; }
.review-value { font-weight: 700; text-align: left; max-width: 60%; }

.footer {
  background: var(--dark); color: #475569; padding: 3rem 2rem;
  text-align: center; font-size: 0.82rem; border-top: 1px solid rgba(255,255,255,0.04);
}
.footer .brand { color: var(--gold); font-weight: 800; font-size: 1.1rem; }

.id-card-visual {
  background: linear-gradient(135deg, #1a3a5c, #0d2a42);
  border-radius: 14px; padding: 1.2rem 1.5rem;
  color: #fff; font-size: 0.8rem; position: relative; overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
}
.id-card-visual::before {
  content: '🦅'; position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
  font-size: 3rem; opacity: 0.08;
}
.id-card-num { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; font-weight: 600; letter-spacing: 2px; color: var(--gold); margin-top: 0.3rem; }

.strength-bar {
  height: 4px;
  border-radius: 4px;
  background: #e2e8f0;
  overflow: hidden;
  margin-top: 0.4rem;
}
.strength-fill {
  height: 100%;
  border-radius: 4px;
  transition: width 0.3s ease, background 0.3s ease;
}

.camera-container {
  position: relative;
  border-radius: 12px;
  overflow: hidden;
  background: #000;
  line-height: 0;
}
.camera-container video {
  width: 100%;
  display: block;
  border-radius: 12px;
}
.camera-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}
.countdown-overlay {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 5rem;
  font-weight: 900;
  color: var(--gold);
  text-shadow: 0 0 30px rgba(212,175,55,0.9);
  z-index: 10;
  animation: pulse 0.8s infinite;
  line-height: 1;
  pointer-events: none;
}
.detection-status-bar {
  padding: 0.6rem 1rem;
  border-radius: 8px;
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-weight: 600;
  font-size: 0.85rem;
  margin-top: 0.8rem;
  transition: all 0.3s ease;
}
.detection-status-bar.good {
  background: rgba(46,139,87,0.12);
  color: var(--green);
  border: 1px solid rgba(46,139,87,0.25);
}
.detection-status-bar.poor {
  background: rgba(220,38,38,0.12);
  color: var(--red);
  border: 1px solid rgba(220,38,38,0.25);
}
.detection-status-bar.loading {
  background: rgba(212,175,55,0.12);
  color: var(--gold);
  border: 1px solid rgba(212,175,55,0.25);
}
.toast {
  position: fixed; bottom: 2rem; left: 2rem; z-index: 9999;
  background: var(--dark2); color: #e2e8f0; padding: 1rem 1.5rem;
  border-radius: 12px; border-left: 4px solid var(--green);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  animation: notifSlide 0.4s cubic-bezier(.22,.68,0,1.2) both;
  font-size: 0.88rem; font-weight: 600; max-width: 300px;
}

@media (max-width: 768px) {
  .grid-2 { grid-template-columns: 1fr; }
  .hero-title { font-size: 2rem; }
  .stats-bar { grid-template-columns: 1fr; gap: 0; }
}

/* Add these to the <style> section in shakwa.html */

/* Progress bar */
.progress-wrap { 
  background: #e2e8f0; 
  border-radius: 10px; 
  height: 8px; 
  overflow: hidden; 
}
.progress-fill { 
  height: 100%; 
  border-radius: 10px; 
  transition: width 0.5s ease; 
}

/* Steps bar - horizontal layout */
.steps-bar { 
  display: flex; 
  align-items: center; 
  gap: 0; 
  margin-bottom: 2.5rem; 
}
.step-dot {
  width: 36px; 
  height: 36px; 
  border-radius: 50%; 
  display: flex; 
  align-items: center; 
  justify-content: center;
  font-weight: 800; 
  font-size: 0.85rem; 
  transition: all 0.3s; 
  flex-shrink: 0;
}
.step-dot.done { 
  background: var(--green); 
  color: #fff; 
}
.step-dot.active { 
  background: var(--nile); 
  color: #fff; 
  animation: borderGlow 2s ease infinite; 
}
.step-dot.pending { 
  background: #e2e8f0; 
  color: #94a3b8; 
}
.step-line { 
  flex: 1; 
  height: 2px; 
  background: #e2e8f0; 
  transition: all 0.3s; 
}
.step-line.done { 
  background: var(--green); 
}

/* Map placeholder */
.map-placeholder {
  width: 100%; 
  height: 280px; 
  border-radius: 14px;
  background: linear-gradient(135deg, #1a2f45, #0d2e1e);
  display: flex; 
  flex-direction: column; 
  align-items: center; 
  justify-content: center;
  position: relative; 
  overflow: hidden; 
  cursor: pointer;
  border: 1.5px solid rgba(27,107,147,0.3);
}
.map-grid {
  position: absolute; 
  inset: 0; 
  opacity: 0.1;
  background-image: linear-gradient(rgba(27,107,147,0.5) 1px, transparent 1px),
    linear-gradient(90deg, rgba(27,107,147,0.5) 1px, transparent 1px);
  background-size: 30px 30px;
}
.map-pin { 
  font-size: 2.5rem; 
  animation: float 2s ease-in-out infinite; 
  z-index: 1; 
}

/* Form card */
.form-card {
  background: #fff; 
  border-radius: 20px; 
  padding: 2.5rem;
  box-shadow: var(--shadow-card); 
  border: 1px solid rgba(0,0,0,0.06);
}

/* Category chips */
.chips-wrap { 
  display: flex; 
  flex-wrap: wrap; 
  gap: 0.5rem; 
  margin-top: 0.8rem; 
}
.chip {
  padding: 0.35rem 1rem; 
  border-radius: 20px; 
  font-size: 0.82rem; 
  font-weight: 600;
  cursor: pointer; 
  transition: all 0.2s; 
  border: 1.5px solid;
}
.chip.default { 
  border-color: #e2e8f0; 
  color: var(--text-mid); 
  background: #fff; 
}
.chip.default:hover { 
  border-color: var(--nile); 
  color: var(--nile); 
}
.chip.selected { 
  border-color: var(--green); 
  color: var(--green); 
  background: rgba(46,139,87,0.08); 
}

/* Evidence gallery */
.evidence-gallery { 
  display: grid; 
  grid-template-columns: repeat(4, 1fr); 
  gap: 0.6rem; 
  margin-top: 0.8rem; 
}
.evidence-thumb {
  aspect-ratio: 1; 
  border-radius: 10px; 
  background: var(--sand);
  display: flex; 
  align-items: center; 
  justify-content: center;
  font-size: 1.5rem; 
  position: relative; 
  overflow: hidden;
  border: 1.5px solid #e2e8f0; 
  cursor: pointer;
}

/* Voice button */
.voice-btn {
  width: 48px; 
  height: 48px; 
  border-radius: 50%; 
  border: none;
  background: linear-gradient(135deg, var(--nile), var(--nile-dark));
  color: #fff; 
  font-size: 1.1rem; 
  cursor: pointer;
  display: flex; 
  align-items: center; 
  justify-content: center;
  transition: all 0.2s; 
  box-shadow: var(--shadow-nile);
  flex-shrink: 0;
}
.voice-btn.recording { 
  background: linear-gradient(135deg, var(--red), #b91c1c); 
  animation: pulse 1s ease-in-out infinite; 
}

/* Sentiment bar */
.sentiment-bar {
  display: flex; 
  align-items: center; 
  gap: 0.8rem;
  padding: 0.7rem 1rem; 
  background: var(--sand); 
  border-radius: 10px; 
  margin-top: 0.5rem;
}

/* Alert styles */
.alert {
  padding: 0.9rem 1.2rem; 
  border-radius: 10px; 
  font-size: 0.88rem;
  font-weight: 600; 
  margin-bottom: 1rem; 
  display: flex; 
  align-items: flex-start; 
  gap: 0.6rem;
}
.alert-info { 
  background: rgba(27,107,147,0.08); 
  color: var(--nile); 
  border: 1px solid rgba(27,107,147,0.2); 
}
.alert-success { 
  background: rgba(46,139,87,0.08); 
  color: var(--green); 
  border: 1px solid rgba(46,139,87,0.2); 
}
.alert-warning { 
  background: rgba(212,175,55,0.08); 
  color: #b07d0f; 
  border: 1px solid rgba(212,175,55,0.2); 
}

/* Upload zone */
.upload-zone {
  border: 2px dashed #cbd5e1; 
  border-radius: 14px; 
  padding: 2rem;
  text-align: center; 
  cursor: pointer; 
  transition: all 0.2s; 
  background: var(--papyrus);
}
.upload-zone:hover { 
  border-color: var(--nile); 
  background: rgba(27,107,147,0.03); 
}

/* Review row */
.review-row {
  display: flex; 
  justify-content: space-between; 
  align-items: flex-start;
  padding: 0.75rem 0; 
  border-bottom: 1px solid #f1f5f9; 
  font-size: 0.88rem;
}
.review-row:last-child { 
  border-bottom: none; 
}
.review-label { 
  color: var(--text-mid); 
  font-weight: 600; 
}
.review-value { 
  font-weight: 700; 
  text-align: left; 
  max-width: 60%; 
}

/* Checkbox */
.checkbox-wrap { 
  display: flex; 
  align-items: flex-start; 
  gap: 0.7rem; 
  cursor: pointer; 
}
.checkbox-input { 
  width: 18px; 
  height: 18px; 
  accent-color: var(--nile); 
  cursor: pointer; 
  flex-shrink: 0; 
  margin-top: 2px; 
}
.checkbox-text { 
  font-size: 0.88rem; 
  color: var(--text-mid); 
  line-height: 1.6; 
}
</style>

function compressImage(dataURL, maxWidth, quality) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      let w = img.width, h = img.height;
      if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality || 0.75));
    };
    img.src = dataURL;
  });
}

  '24': 'Minya', '25': 'Asyut', '26': 'Sohag', '27': 'Qena', '28': 'Aswan',
  '29': 'Luxor', '31': 'Red Sea', '32': 'New Valley', '33': 'Matruh',
  '34': 'North Sinai', '35': 'South Sinai', '88': 'Born outside Egypt'
};

function getNationalIdError(id, lang) {
  if (!id || id.length === 0) return null;
  if (id.length !== 14) {
    return {
      message: lang === 'ar' ? `الرقم القومي يجب أن يكون 14 رقم (أنت أدخلت ${id.length} رقم)` : `National ID must be 14 digits (you entered ${id.length} digits)`,
      fullId: id,
      errorPositions: []
    };
  }
  if (!/^\d+$/.test(id)) {
    for (let i = 0; i < id.length; i++) {
      if (isNaN(parseInt(id[i]))) {
        return {
          message: lang === 'ar' ? `الرقم ${i+1} ('${id[i]}') ليس رقماً صحيحاً` : `Digit ${i+1} ('${id[i]}') is not a valid number`,
          fullId: id,
          errorPositions: [i+1]
        };
      }
    }
  }
  const century = id[0];
  if (century !== '2' && century !== '3') {
    return {
      message: lang === 'ar' ? `الرقم الأول '${century}' غير صحيح. يجب أن يكون 2 أو 3` : `First digit '${century}' is invalid. Must be 2 or 3`,
      fullId: id,
      errorPositions: [1]
    };
  }
  const month = id.substr(3, 2);
  const monthNum = parseInt(month);
  if (monthNum < 1 || monthNum > 12) {
    return {
      message: lang === 'ar' ? `الرقمين ${id[3]}${id[4]} (الموقع 4-5) شهر غير صحيح` : `Digits ${id[3]}${id[4]} (positions 4-5) invalid month`,
      fullId: id,
      errorPositions: [4, 5]
    };
  }
  const year = id.substr(1, 2);
  const day = id.substr(5, 2);
  const dayNum = parseInt(day);
  const daysInMonth = new Date(parseInt(year), monthNum, 0).getDate();
  if (dayNum < 1 || dayNum > daysInMonth) {
    return {
      message: lang === 'ar' ? `الرقمين ${id[5]}${id[6]} (الموقع 6-7) يوم غير صحيح` : `Digits ${id[5]}${id[6]} (positions 6-7) invalid day`,
      fullId: id,
      errorPositions: [6, 7]
    };
  }
  const governorateCode = id.substr(7, 2);
  if (!governorateCodes[governorateCode]) {
    return {
      message: lang === 'ar' ? `الرقمين ${id[7]}${id[8]} (الموقع 8-9) رمز محافظة غير صحيح` : `Digits ${id[7]}${id[8]} (positions 8-9) invalid governorate`,
      fullId: id,
      errorPositions: [8, 9]
    };
  }
  return null;
}

function formatIdWithErrors(id, errorPositions) {
  if (!id) return '';
  const digits = id.split('');
  return digits.map((digit, index) => {
    const isError = errorPositions.includes(index + 1);
    if (isError) return `<strong style="color: #dc2626; font-size: 1.1rem;">${digit}</strong>`;
    return digit;
  }).join('');
}

  const [showForgotPassword, setShowForgotPassword] = useState(false);
  const [forgotStep, setForgotStep] = useState(1);
  const [forgotNationalId, setForgotNationalId] = useState('');
  const [forgotPhone, setForgotPhone] = useState('');
  const [otpCode, setOtpCode] = useState('');
  const [newPassword, setNewPassword] = useState('');
  const [confirmNewPassword, setConfirmNewPassword] = useState('');
  const [countdown, setCountdown] = useState(0);
  const countdownRef = useRef(null);

  const validatePhoneNumber = (phone) => {
    if (!phone) return { valid: false, message: lang === 'ar' ? 'رقم الهاتف مطلوب' : 'Phone number is required' };
    if (!/^\d+$/.test(phone)) return { valid: false, message: lang === 'ar' ? 'رقم الهاتف يجب أن يحتوي على أرقام فقط' : 'Phone number must contain only numbers' };
    if (phone.length !== 11) return { valid: false, message: lang === 'ar' ? `رقم الهاتف يجب أن يكون 11 رقم (أنت أدخلت ${phone.length} رقم)` : `Phone number must be 11 digits (you entered ${phone.length} digits)` };
    const prefix = phone.substr(0, 3);
    const validPrefixes = ['010', '011', '012', '015'];
    if (!validPrefixes.includes(prefix)) return { valid: false, message: lang === 'ar' ? 'رمز الشبكة غير صحيح' : 'Invalid network code' };
    return { valid: true, message: '' };
  };

  useEffect(() => {
    const savedId = localStorage.getItem('shakwa_saved_national_id');
    if (savedId) {
      setNationalId(savedId);
      setRememberMe(true);
    }
  }, []);

  useEffect(() => {
    return () => { if (countdownRef.current) clearInterval(countdownRef.current); };
  }, []);

  const handleNationalIdChange = (e) => {
    const value = e.target.value;
    if (value === '' || /^\d+$/.test(value)) {
      setNationalId(value);
      if (value.length === 14) {
        const error = getNationalIdError(value, lang);
        setIdErrorDetail(error);
      } else {
        setIdErrorDetail(null);
      }

    setError('');
    if (!nationalId) {
      setError(lang === 'ar' ? 'الرجاء إدخال الرقم القومي' : 'Please enter National ID');

      setError(lang === 'ar' ? 'الرجاء تصحيح الأخطاء في الرقم القومي' : 'Please correct the errors in the National ID');

          {error && (<div className="alert alert-warning" style={{ marginBottom: '1rem' }}><Icon name="alert-circle" size={16} color="#b07d0f" /><span>{error}</span></div>)}
          <div style={{ marginBottom: '1rem' }}>

            <button onClick={() => setShowForgotPassword(true)} style={{ background: 'none', border: 'none', color: 'var(--nile)', fontSize: '0.8rem', cursor: 'pointer', fontWeight: 600 }}>{lang === 'ar' ? 'نسيت كلمة المرور؟' : 'Forgot password?'}</button>

// ========== SIMPLIFIED WORKING SELFIE CAMERA STEP ==========
// ========== SIMPLIFIED WORKING SELFIE CAMERA STEP ==========
function SelfieCameraStep({ lang, captured, preview, onCapture, onRetake, onBack, onNext, nextDisabled }) {
  const videoRef = useRef(null);
  const overlayRef = useRef(null);
  const streamRef = useRef(null);
  const detectionIntervalRef = useRef(null);
  const countdownRef = useRef(null);
  const [cameraActive, setCameraActive] = useState(false);
  const [cameraError, setCameraError] = useState(false);
  const [cameraErrorMessage, setCameraErrorMessage] = useState('');
  const [videoReady, setVideoReady] = useState(false);
  const [faceDetected, setFaceDetected] = useState(false);
  const [idDetected, setIdDetected] = useState(false);
  const [autoCaptureCountdown, setAutoCaptureCountdown] = useState(0);
  const containerRef = useRef(null);

  // ========== ADJUST THESE NUMBERS TO CHANGE SENSITIVITY ==========
  const FACE_SENSITIVITY = 0.12;
  const CARD_SENSITIVITY = 0.02;
  const DETECTION_INTERVAL_MS = 150;
  // =================================================================

  const stopCamera = useCallback(() => {
    if (detectionIntervalRef.current) clearInterval(detectionIntervalRef.current);
    if (countdownRef.current) clearInterval(countdownRef.current);
    if (streamRef.current) {
      streamRef.current.getTracks().forEach(track => track.stop());
      streamRef.current = null;
    }
    if (videoRef.current) videoRef.current.srcObject = null;
    setCameraActive(false);
    setVideoReady(false);
    setAutoCaptureCountdown(0);
  }, []);

  useEffect(() => () => stopCamera(), [stopCamera]);

  // ========== DRAW GUIDES - WITH 9:5 RATIO AND WHITE TEXT ==========
  const drawGuides = useCallback(() => {
    const video = videoRef.current;
    const canvas = overlayRef.current;
    if (!video || !canvas || video.videoWidth === 0) return;
    
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    const W = canvas.width;
    const H = canvas.height;
    
    // ========== FACE GUIDE ==========
    const faceCX = W / 3;
    const faceCY = H * 0.32;
    const faceRX = W * 0.22;
    const faceRY = H * 0.25;
    
    ctx.save();
    ctx.beginPath();
    ctx.ellipse(faceCX, faceCY, faceRX, faceRY, 0, 0, Math.PI * 2);
    ctx.strokeStyle = faceDetected ? '#2E8B57' : '#D4AF37';
    ctx.lineWidth = 4;
    ctx.setLineDash([10, 8]);
    ctx.stroke();
    ctx.setLineDash([]);
    
    let faceLabelFontSize = Math.floor(W * 0.04);
    faceLabelFontSize = Math.min(28, Math.max(16, faceLabelFontSize));
    ctx.font = `bold ${faceLabelFontSize}px Cairo, sans-serif`;
    ctx.fillStyle = '#FFFFFF';
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 3;
    ctx.textAlign = 'center';
    ctx.fillText(lang === 'ar' ? 'ضع وجهك هنا' : 'Place Face Here', faceCX, faceCY - faceRY - 12);
    ctx.shadowBlur = 0;
    
    // ========== ID CARD GUIDE ==========
    const targetRatio = 9 / 5;
    let cardW = W * 0.36;
    let cardH = cardW / targetRatio;
    const cardX = W - cardW - (W * 0.04);
    const cardY = H * 0.48;
    
    ctx.beginPath();
    ctx.rect(cardX, cardY, cardW, cardH);
    ctx.strokeStyle = idDetected ? '#2E8B57' : '#D4AF37';
    ctx.lineWidth = 4;
    ctx.setLineDash([10, 8]);
    ctx.stroke();
    ctx.setLineDash([]);
    
    let cardLabelFontSize = Math.floor(W * 0.04);
    cardLabelFontSize = Math.min(24, Math.max(14, cardLabelFontSize));
    ctx.font = `bold ${cardLabelFontSize}px Cairo, sans-serif`;
    ctx.fillStyle = '#FFFFFF';
    ctx.shadowBlur = 3;
    ctx.fillText(lang === 'ar' ? 'أمسك البطاقة هنا' : 'Hold ID Card Here', cardX + cardW / 2, cardY - 10);
    ctx.shadowBlur = 0;
    
    const cornerLen = 20;
    ctx.lineWidth = 4;
    ctx.strokeStyle = '#D4AF37';
    ctx.setLineDash([]);
    
    ctx.beginPath();
    ctx.moveTo(cardX + cornerLen, cardY);
    ctx.lineTo(cardX, cardY);
    ctx.lineTo(cardX, cardY + cornerLen);
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(cardX + cardW - cornerLen, cardY);
    ctx.lineTo(cardX + cardW, cardY);
    ctx.lineTo(cardX + cardW, cardY + cornerLen);
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(cardX, cardY + cardH - cornerLen);
    ctx.lineTo(cardX, cardY + cardH);
    ctx.lineTo(cardX + cornerLen, cardY + cardH);
    ctx.stroke();
    
    ctx.beginPath();
    ctx.moveTo(cardX + cardW - cornerLen, cardY + cardH);
    ctx.lineTo(cardX + cardW, cardY + cardH);
    ctx.lineTo(cardX + cardW, cardY + cardH - cornerLen);
    ctx.stroke();
    
    ctx.textAlign = 'left';
    ctx.restore();
  }, [lang, faceDetected, idDetected]);

  // ========== ID CARD DETECTION ==========
  const detectIDCard = useCallback((video) => {
    if (!video || video.videoWidth === 0) return false;
    
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    const targetRatio = 9 / 5;
    let cardW = canvas.width * 0.4;
    let cardH = cardW / targetRatio;
    const cardX = canvas.width - cardW - (canvas.width * 0.03);
    const cardY = canvas.height * 0.48;
    
    const expandPixels = 20;
    const detX = Math.max(0, cardX - expandPixels);
    const detY = Math.max(0, cardY - expandPixels);
    const detW = Math.min(canvas.width - detX, cardW + (expandPixels * 2));
    const detH = Math.min(canvas.height - detY, cardH + (expandPixels * 2));
    
    try {
      const imageData = ctx.getImageData(detX, detY, detW, detH);
      const data = imageData.data;
      let edges = 0;
      let prevBright = 0;
      let samples = 0;
      
      for (let i = 0; i < data.length; i += 12) {
        const r = data[i];
        const g = data[i+1];
        const b = data[i+2];
        const brightness = (r + g + b) / 3;
        
        if (i > 0 && Math.abs(brightness - prevBright) > 25) {
          edges++;
        }
        prevBright = brightness;
        samples++;
      }
      
      const edgeRatio = samples > 0 ? edges / samples : 0;
      return edgeRatio > 0.025;
    } catch (e) {
      return false;
    }
  }, []);

    // ========== FACE DETECTION WITH PROPER BOUNDARY CHECK ==========
  const detectFace = useCallback((video) => {
    if (!video || video.videoWidth === 0) return false;
    
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    
    // Face oval area (must match drawGuides exactly)
    const centerX = canvas.width / 2;
    const centerY = canvas.height * 0.32;
    const radiusX = canvas.width * 0.22;
    const radiusY = canvas.height * 0.25;
    
    // The detection area (the oval bounds)
    const left = centerX - radiusX;
    const right = centerX + radiusX;
    const top = centerY - radiusY;
    const bottom = centerY + radiusY;
    
    // Check if face is WITHIN the oval area - sample multiple points
    const samplePoints = [
      [centerX, centerY],           // center
      [centerX - radiusX/2, centerY], // left middle
      [centerX + radiusX/2, centerY], // right middle
      [centerX, centerY - radiusY/2], // top middle
      [centerX, centerY + radiusY/2], // bottom middle
    ];
    
    let pointsInside = 0;
    
    for (const [x, y] of samplePoints) {
      // Check if point is inside ellipse: ((x-h)^2 / a^2) + ((y-k)^2 / b^2) <= 1
      const dx = (x - centerX) / radiusX;
      const dy = (y - centerY) / radiusY;
      if (dx * dx + dy * dy <= 1) {
        pointsInside++;
      }
    }
    
    // If most sample points are inside the ellipse, consider face in frame
    const isInside = pointsInside >= 3;
    
    if (!isInside) return false;
    
    // Now check actual face detection within that area
    try {
      const faceX = Math.max(0, Math.floor(left));
      const faceY = Math.max(0, Math.floor(top));
      const faceW = Math.min(canvas.width - faceX, Math.floor(radiusX * 2));
      const faceH = Math.min(canvas.height - faceY, Math.floor(radiusY * 2));
      
      if (faceW <= 0 || faceH <= 0) return false;
      
      const imageData = ctx.getImageData(faceX, faceY, faceW, faceH);
      const data = imageData.data;
      let skinPixels = 0;
      let totalPixels = 0;
      
      for (let i = 0; i < data.length; i += 8) { // Sample fewer pixels for performance
        const r = data[i];
        const g = data[i+1];
        const b = data[i+2];
        // Skin color detection range
        if (r > 70 && g > 40 && b > 30 && r > g && r > b) {
          skinPixels++;
        }
        totalPixels++;
      }
      
      const ratio = totalPixels > 0 ? skinPixels / totalPixels : 0;
      // Require higher ratio for detection (face must be clearly visible)
      return ratio > 0.12;
    } catch (e) {
      return false;
    }
  }, []);

  // Detection loop
  const startDetection = useCallback(() => {
    if (detectionIntervalRef.current) clearInterval(detectionIntervalRef.current);
    
    detectionIntervalRef.current = setInterval(() => {
      const video = videoRef.current;
      if (!video || video.readyState !== 4) return;
      
      const faceInside = detectFace(video);
      const cardInside = detectIDCard(video);
      
      setFaceDetected(faceInside);
      setIdDetected(cardInside);
      drawGuides();
      
      if (faceInside && cardInside && !captured && autoCaptureCountdown === 0 && !countdownRef.current) {
        let count = 3;
        setAutoCaptureCountdown(count);
        countdownRef.current = setInterval(() => {
          count--;
          setAutoCaptureCountdown(count);
          if (count <= 0) {
            clearInterval(countdownRef.current);
            countdownRef.current = null;
            capturePhoto();
          }
        }, 1000);
      } else if ((!faceInside || !cardInside) && countdownRef.current) {
        clearInterval(countdownRef.current);
        countdownRef.current = null;
        setAutoCaptureCountdown(0);
      }
    }, DETECTION_INTERVAL_MS);
  }, [detectFace, detectIDCard, drawGuides, captured, autoCaptureCountdown]);

  // Start camera
  const startCamera = useCallback(async () => {
    setCameraError(false);
    const video = videoRef.current;
    if (!video) return;
    
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      
      streamRef.current = stream;
      video.srcObject = stream;
      
      video.onloadedmetadata = () => {
        video.play().then(() => {
          setVideoReady(true);
          setCameraActive(true);
          setTimeout(() => {
            drawGuides();
            startDetection();
          }, 100);
        });
      };
    } catch (err) {
      setCameraError(true);
      setCameraErrorMessage(lang === 'ar' ? 'فشل الوصول إلى الكاميرا' : 'Failed to access camera');
    }
  }, [lang, drawGuides, startDetection]);

  // Capture photo
  const capturePhoto = useCallback(() => {
    const video = videoRef.current;
    if (!video || video.readyState !== 4) {
      alert(lang === 'ar' ? 'الكاميرا غير جاهزة' : 'Camera not ready');
      return;
    }
    
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    const imageData = canvas.toDataURL('image/jpeg', 0.95);
    stopCamera();
    onCapture(imageData);
  }, [stopCamera, onCapture, lang]);

  useEffect(() => {
    if (videoReady) drawGuides();
  }, [videoReady, faceDetected, idDetected, drawGuides]);

  // FIXED: Removed verificationCountdownRef
  useEffect(() => {
    return () => {
      if (detectionIntervalRef.current) clearInterval(detectionIntervalRef.current);
      if (countdownRef.current) clearInterval(countdownRef.current);
    };
  }, []);

  // Render
  if (captured) {
    return (
      <div>
        <div className="upload-zone drag" style={{ padding: '1rem', textAlign: 'center' }}>
          <img src={preview} style={{ maxWidth: '100%', maxHeight: 200, borderRadius: 12, objectFit: 'cover' }} />
          <p style={{ color: 'var(--green)', fontWeight: 700, marginTop: '0.5rem' }}>
            <Icon name="check-circle-2" size={20} color="var(--green)" />
            {lang === 'ar' ? '✓ تم الالتقاط بنجاح' : '✓ Captured successfully'}
          </p>
          <button onClick={onRetake} style={{ color: 'var(--red)', cursor: 'pointer', fontWeight: 'bold' }}>
            <Icon name="refresh-cw" size={16} color="var(--red)" />
            {lang === 'ar' ? 'إعادة التصوير' : 'Retake'}
          </button>
        </div>
        <div style={{ display: 'flex', gap: '0.8rem', marginTop: '1.5rem' }}>
          <button onClick={onBack} style={{ flex: 1, padding: '0.75rem', background: 'transparent', border: '1.5px solid #e2e8f0', borderRadius: 12, cursor: 'pointer' }}>
            {lang === 'ar' ? '← رجوع' : '← Back'}
          </button>
          <button className="btn-gold" style={{ flex: 2 }} onClick={onNext} disabled={nextDisabled}>
            {lang === 'ar' ? 'التالي ←' : 'Next →'}
          </button>
        </div>
      </div>
    );
  }

  return (
    <div>
      <h3 style={{ fontWeight: 900, marginBottom: '0.5rem', fontSize: '1.4rem', textAlign: 'center' }}>
        {lang === 'ar' ? 'التقط صورة شخصية مع البطاقة' : 'Take a Selfie with Your ID Card'}

        <button className="btn-gold" onClick={startCamera} style={{ width: '100%', marginTop: '1rem', padding: '1rem', fontSize: '1.1rem', fontWeight: 'bold', borderRadius: 12 }}>
          <Icon name="camera" size={20} color="#1a1a1a" />

              <span>{lang === 'ar' ? 'جارٍ تحميل الكاميرا...' : 'Loading camera...'}</span>

              <div className={`alert ${faceDetected ? 'alert-success' : 'alert-info'}`} style={{ flex: 1, padding: '0.5rem', borderRadius: 10 }}>
                <Icon name={faceDetected ? 'check-circle-2' : 'circle'} size={16} color={faceDetected ? 'var(--green)' : 'var(--nile)'} />
                <span>{faceDetected ? '✓ الوجه مرئي' : '○ انتظر الوجه'}</span>
              </div>
              <div className={`alert ${idDetected ? 'alert-success' : 'alert-info'}`} style={{ flex: 1, padding: '0.5rem', borderRadius: 10 }}>
                <Icon name={idDetected ? 'check-circle-2' : 'circle'} size={16} color={idDetected ? 'var(--green)' : 'var(--nile)'} />
                <span>{idDetected ? '✓ البطاقة مرئية' : '○ انتظر البطاقة'}</span>
              </div>
            </div>
          )}
          
          <div style={{ display: 'flex', gap: '0.8rem', marginTop: '0.8rem' }}>
            <button className="btn-gold" style={{ flex: 2, padding: '0.9rem' }} onClick={capturePhoto} disabled={!videoReady}>
              <Icon name="camera" size={18} color="#1a1a1a" />
              {lang === 'ar' ? 'التقاط الصورة' : 'Capture Photo'}
            </button>
            <button onClick={stopCamera} style={{ flex: 1, padding: '0.9rem', background: 'transparent', border: '1.5px solid #e2e8f0', borderRadius: 12, cursor: 'pointer' }}>
              <Icon name="x" size={16} />
              {lang === 'ar' ? 'إلغاء' : 'Cancel'}
            </button>
          </div>
        </>
      )}

      <div style={{ display: 'flex', gap: '0.8rem', marginTop: '1rem' }}>
        <button onClick={onBack} style={{ flex: 1, padding: '0.75rem', background: 'transparent', border: '1.5px solid #e2e8f0', borderRadius: 12, cursor: 'pointer' }}>
          {lang === 'ar' ? '← رجوع' : '← Back'}
        </button>
        <button className="btn-gold" style={{ flex: 2 }} onClick={onNext} disabled={nextDisabled}>
          {lang === 'ar' ? 'التالي ←' : 'Next →'}
        </button>
      </div>
    </div>
  );
}

// ========== STEP 4 REVIEW (Turnstile + Submit) ==========
function Step4Review({ lang, nationalId, fullName, phone, governate, frontPreview, backPreview, selfiePreview, loading, onBack, onSubmit }) {
  const [agreed, setAgreed] = useState(false);
  const [turnstileToken, setTurnstileToken] = useState(null);
  const widgetRef = useRef(null);

  useEffect(() => {
    const container = widgetRef.current;
    if (!container || !window.turnstile) return;
    container.innerHTML = '';
    window.turnstile.render(container, {
      sitekey: '0x4AAAAAAC7SAesR_Nhxv3l0',
      theme: 'light',
      language: lang === 'ar' ? 'ar' : 'en',
      callback: (token) => { setTurnstileToken(token); },
      'error-callback': () => { setTurnstileToken(null); }
    });
    return () => { if (container) container.innerHTML = ''; };
  }, [lang]);

  const rows = [
    [lang === 'ar' ? 'الرقم القومي' : 'National ID', nationalId.replace(/(\d{4})(\d{6})(\d{4})/, '$1-$2-$3')],
    [lang === 'ar' ? 'الاسم الكامل' : 'Full Name', fullName],
    [lang === 'ar' ? 'الهاتف' : 'Phone', phone],
    [lang === 'ar' ? 'المحافظة' : 'Governate', governate],
  ];

  return (
    <div>
      <h3 style={{ fontWeight: 800, marginBottom: '0.3rem', fontSize: '1.2rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
        <Icon name="clipboard-check" size={18} color="#1B6B93" />
        {lang === 'ar' ? 'مراجعة البيانات' : 'Review Your Information'}
      </h3>
      <p style={{ color: 'var(--text-mid)', fontSize: '0.85rem', marginBottom: '1.5rem' }}>
        {lang === 'ar' ? 'تأكد من صحة بياناتك قبل الإرسال' : 'Verify your information before submitting'}
      </p>
      <div style={{ display: 'flex', gap: '0.8rem', marginBottom: '1.2rem', flexWrap: 'wrap' }}>
        {[
          { img: frontPreview, label: lang === 'ar' ? 'الهوية — أمامي' : 'ID Front' },
          { img: backPreview, label: lang === 'ar' ? 'الهوية — خلفي' : 'ID Back' },
          { img: selfiePreview, label: lang === 'ar' ? 'الصورة الشخصية مع البطاقة' : 'Selfie with ID' },
        ].map((p, i) => p.img && (
          <div key={i} style={{ flex: 1, minWidth: 80, textAlign: 'center' }}>
            <img src={p.img} alt={p.label} style={{ width: '100%', maxWidth: 100, height: 70, objectFit: 'cover', borderRadius: 8, border: '2px solid var(--green)' }} />
            <p style={{ fontSize: '0.68rem', color: 'var(--text-mid)', marginTop: '0.3rem' }}>{p.label}</p>
          </div>
        ))}
      </div>
      <div style={{ background: 'var(--papyrus)', borderRadius: '12px', padding: '1.2rem', marginBottom: '1.2rem' }}>
        {rows.map(([label, value], i) => (
          <div key={i} className="review-row"><span className="review-label">{label}</span><span className="review-value" style={{ fontFamily: i === 0 ? 'JetBrains Mono, monospace' : 'inherit' }}>{value}</span></div>
        ))}
      </div>
      <label className="checkbox-wrap" style={{ marginBottom: '1.5rem' }}>
        <input type="checkbox" className="checkbox-input" checked={agreed} onChange={e => setAgreed(e.target.checked)} />
        <span className="checkbox-text">{lang === 'ar' ? 'أقر بصحة المعلومات وأوافق على الشروط والأحكام' : 'I certify the information is accurate and agree to Terms & Conditions'}</span>
      </label>
      <div ref={widgetRef} style={{ marginBottom: '1rem', minHeight: 65 }} />
      <div style={{ display: 'flex', gap: '0.8rem' }}>
        <button onClick={onBack} style={{ flex: 1, padding: '0.75rem', background: 'transparent', border: '1.5px solid #e2e8f0', borderRadius: 10, fontFamily: 'Cairo', fontWeight: 700, cursor: 'pointer', color: 'var(--text-mid)' }}>
          {lang === 'ar' ? '← رجوع' : '← Back'}
        </button>
        <button className="btn-gold" style={{ flex: 2, opacity: (!agreed || !turnstileToken) ? 0.6 : 1, cursor: (!agreed || !turnstileToken) ? 'not-allowed' : 'pointer' }} onClick={onSubmit} disabled={!agreed || !turnstileToken || loading}>
          {loading ? <span className="spinner" style={{ width: 20, height: 20, display: 'inline-block', borderWidth: 2 }} /> : <span style={{ display: 'inline-flex', alignItems: 'center', gap: '0.5rem' }}><Icon name="user-check" size={16} color="#1a1a1a" /> {lang === 'ar' ? 'إنشاء الحساب' : 'Create Account'}</span>}
        </button>
      </div>
    </div>
  );
}

// ========== REGISTER PAGE (6 Steps) ==========
function RegisterPage({ setPage, lang }) {
  const [step, setStep] = useState(1);
  const [nationalId, setNationalId] = useState('');
  const [idError, setIdError] = useState('');
  const [idValid, setIdValid] = useState(false);
  const [frontCaptured, setFrontCaptured] = useState(false);
  const [frontPreview, setFrontPreview] = useState(null);
  const [frontImage, setFrontImage] = useState(null);
  const [backCaptured, setBackCaptured] = useState(false);
  const [backPreview, setBackPreview] = useState(null);
  const [backImage, setBackImage] = useState(null);
  const [selfieCaptured, setSelfieCaptured] = useState(false);
  const [selfiePreview, setSelfiePreview] = useState(null);
  const [selfieImage, setSelfieImage] = useState(null);
  const [fullName, setFullName] = useState('');
  const [phone, setPhone] = useState('');
  const [governate, setGovernate] = useState('');
  const [password, setPassword] = useState('');
  const [confirmPass, setConfirmPass] = useState('');
  const [showPass, setShowPass] = useState(false);
  const [loading, setLoading] = useState(false);
  const [done, setDone] = useState(false);
  const [phoneError, setPhoneError] = useState('');
  const [phoneErrorDetail, setPhoneErrorDetail] = useState(null);
  const [verificationCode, setVerificationCode] = useState('');
  const [verificationCountdown, setVerificationCountdown] = useState(0);
  const [sentCode, setSentCode] = useState(false);
  const verificationCountdownRef = useRef(null);
  const [idErrorDetail, setIdErrorDetail] = useState(null);
  const frontFileRef = useRef(null);
  const backFileRef = useRef(null);

  const GOVS = ['القاهرة', 'الجيزة', 'الإسكندرية', 'الدقهلية', 'البحيرة', 'الشرقية', 'المنيا', 'أسيوط', 'الفيوم', 'سوهاج', 'قنا', 'أسوان', 'الأقصر'];
  const GOVS_EN = ['Cairo', 'Giza', 'Alexandria', 'Dakahlia', 'Beheira', 'Sharqia', 'Minya', 'Asyut', 'Faiyum', 'Sohag', 'Qena', 'Aswan', 'Luxor'];

  // Validate Egyptian phone number
  const validatePhoneNumber = (phone) => {
    if (!phone) {
      return { valid: false, message: lang === 'ar' ? 'رقم الهاتف مطلوب' : 'Phone number is required' };
    }
    if (!/^\d+$/.test(phone)) {
      return { valid: false, message: lang === 'ar' ? 'رقم الهاتف يجب أن يحتوي على أرقام فقط' : 'Phone number must contain only numbers' };
    }
    if (phone.length !== 11) {
      return { valid: false, message: lang === 'ar' ? `رقم الهاتف يجب أن يكون 11 رقم (أنت أدخلت ${phone.length} رقم)` : `Phone number must be 11 digits (you entered ${phone.length} digits)` };
    }
    const prefix = phone.substr(0, 3);
    const validPrefixes = ['010', '011', '012', '015'];
    if (!validPrefixes.includes(prefix)) {
      return { valid: false, message: lang === 'ar' ? 'رمز الشبكة غير صحيح. الاستخدام: 010 (فودافون), 011 (اتصالات), 012 (أورنج), 015 (وي)' : 'Invalid network code. Use: 010 (Vodafone), 011 (Etisalat), 012 (Orange), 015 (WE)' };
    }
    return { valid: true, message: '' };
  };

  const formatPhoneWithErrors = (phone, errorPositions) => {
    if (!phone) return '';
    const digits = phone.split('');
    return digits.map((digit, index) => {
      const isError = errorPositions && errorPositions.includes(index + 1);
      if (isError) {
        return `<strong style="color: #dc2626; font-size: 1rem;">${digit}</strong>`;
      }
      return digit;
    }).join('');
  };

  const validateId = (val) => {
    setNationalId(val);
    if (val.length === 14 && /^\d{14}$/.test(val)) {
      setIdError(''); setIdValid(true);
    } else if (val.length > 0) {
      setIdError(lang === 'ar' ? 'الرقم القومي يجب أن يكون 14 رقماً' : 'National ID must be 14 digits');
      setIdValid(false);
    } else { setIdError(''); setIdValid(false); }
  };

  const handleFrontUpload = (event) => {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        compressImage(e.target.result, 800, 0.75).then(compressed => {
          setFrontImage(compressed);
          setFrontPreview(compressed);
          setFrontCaptured(true);
          if (window.Tesseract) {
            window.Tesseract.recognize(compressed, 'ara').then(({ data: { text } }) => {
              const nameMatch = text.match(/الاسم[:\s]*([^\n]+)/i);
              const idMatch = text.match(/\d{14}/);
              if (nameMatch && !fullName) setFullName(nameMatch[1].trim());
              if (idMatch && !nationalId) setNationalId(idMatch[0]);
            }).catch(() => {});
          }
        });
      };
      reader.readAsDataURL(file);
    }
  };

  const handleBackUpload = (event) => {
    const file = event.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        compressImage(e.target.result, 800, 0.75).then(compressed => {
          setBackImage(compressed);
          setBackPreview(compressed);
          setBackCaptured(true);
        });
      };
      reader.readAsDataURL(file);
    }
  };

  const passStrength = password.length >= 12 ? 'strong' : password.length >= 8 ? 'medium' : 'weak';
  const passColor = passStrength === 'strong' ? 'var(--green)' : passStrength === 'medium' ? 'var(--gold)' : 'var(--red)';
  const passLabel = passStrength === 'strong' ? (lang === 'ar' ? 'قوية' : 'Strong') : passStrength === 'medium' ? (lang === 'ar' ? 'متوسطة' : 'Medium') : (lang === 'ar' ? 'ضعيفة' : 'Weak');

  const handleFinalSubmit = () => {
    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      setDone(true);
    }, 1800);
  };

  const t = lang === 'ar' ? {
    title: 'إنشاء حساب جديد',
    steps: ['الرقم القومي', 'البطاقة (الأمامي)', 'البطاقة (الخلفي)', 'الصورة الشخصية', 'بيانات الحساب', 'التحقق من الهاتف', 'مراجعة'],
    s1title: 'أدخل رقمك القومي', s1sub: 'سيتم استخدامه للتحقق من هويتك فقط', s1label: 'الرقم القومي (14 رقماً)',
    s3title: 'أكمل بياناتك', nameLbl: 'الاسم الكامل', phoneLbl: 'رقم الهاتف', govLbl: 'المحافظة', passLbl: 'كلمة المرور', confirmLbl: 'تأكيد كلمة المرور',
    submit: 'إنشاء الحساب', doneTitle: 'تم إنشاء حسابك بنجاح!', doneSub: 'يمكنك الآن تقديم شكاواك', doneBtn: 'أبلغ عن مشكلة الآن'
  } : {
    title: 'Create New Account',
    steps: ['National ID', 'ID Front', 'ID Back', 'Selfie', 'Account Info', 'Phone Verification', 'Review'],
    s1title: 'Enter Your National ID', s1sub: 'Used for identity verification only', s1label: 'National ID (14 digits)',
    s3title: 'Complete Your Profile', nameLbl: 'Full Name', phoneLbl: 'Phone Number', govLbl: 'Governate', passLbl: 'Password', confirmLbl: 'Confirm Password',
    submit: 'Create Account', doneTitle: 'Account Created Successfully!', doneSub: 'You can now submit your complaints', doneBtn: 'Report an Issue Now'
  };

  if (done) return (
    <div className="page" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', background: 'var(--papyrus)', padding: '2rem' }}>
      <div style={{ textAlign: 'center', maxWidth: 440 }}>
        <div style={{ marginBottom: '1.5rem' }}><div style={{ width: 90, height: 90, borderRadius: '50%', background: 'linear-gradient(135deg, var(--gold), #f5d66b)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto' }}><Icon name="check-circle-2" size={44} color="#fff" /></div></div>
        <h2 style={{ fontSize: '1.8rem', fontWeight: 900, marginBottom: '0.5rem' }}>{t.doneTitle}</h2>
        <p style={{ color: 'var(--text-mid)', marginBottom: '2rem' }}>{t.doneSub}</p>
        <button className="btn-gold" onClick={() => setPage('submit')}>{t.doneBtn} →</button>
        <button onClick={() => setPage('dashboard')} style={{ marginTop: '1rem', display: 'block', width: '100%', padding: '0.7rem', background: 'transparent', border: '1.5px solid var(--nile)', borderRadius: '10px', color: 'var(--nile)', fontFamily: 'Cairo', fontWeight: 700, cursor: 'pointer' }}>{lang === 'ar' ? 'الذهاب للوحة التحكم' : 'Go to Dashboard'}</button>
      </div>
    </div>
  );

  return (
    <div className="page page-transition" style={{ background: 'var(--papyrus)', padding: '2rem', minHeight: '100vh' }}>
      <div style={{ maxWidth: 620, margin: '2rem auto' }}>
        <h2 style={{ fontSize: '1.6rem', fontWeight: 900, marginBottom: '0.3rem' }}>{t.title}</h2>
        <p style={{ color: 'var(--text-mid)', marginBottom: '2rem', fontSize: '0.9rem' }}>شكوى | Shakwa</p>
        <div className="steps-bar" style={{ marginBottom: '2.5rem' }}>
          {t.steps.map((s, i) => (
            <React.Fragment key={i}>
              <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '0.3rem' }}>
                <div className={`step-dot ${i + 1 < step ? 'done' : i + 1 === step ? 'active' : 'pending'}`}>{i + 1 < step ? <Icon name="check" size={14} color="#fff" /> : i + 1}</div>
                <span style={{ fontSize: '0.62rem', color: i + 1 === step ? 'var(--nile)' : '#94a3b8', fontWeight: 600, whiteSpace: 'nowrap' }}>{s}</span>
              </div>
              {i < t.steps.length - 1 && <div className={`step-line ${i + 1 < step ? 'done' : ''}`} />}
            </React.Fragment>
          ))}
        </div>
        <div className="form-card">
          
          {/* STEP 1: National ID */}
                    {step === 1 && (
            <div>
              <h3 style={{ fontWeight: 800, marginBottom: '0.3rem', fontSize: '1.2rem' }}>{t.s1title}</h3>
              <p style={{ color: 'var(--text-mid)', fontSize: '0.85rem', marginBottom: '1.8rem' }}>{t.s1sub}</p>
              <label className="form-label">{t.s1label}</label>
              <input 
                type="text" 
                className="form-input" 
                value={nationalId} 
                onChange={(e) => {
                  const value = e.target.value;
                  if (value === '' || /^\d+$/.test(value)) {
                    setNationalId(value);
                    if (value.length === 14) {
                      const error = getNationalIdError(value, lang);
                      setIdErrorDetail(error);
                      if (!error) setIdValid(true);
                      else setIdValid(false);
                    } else {
                      setIdErrorDetail(null);
                      setIdValid(false);
                    }
                  }
                }}
                maxLength={14} 
                placeholder="29801011234567" 
                style={{ textAlign: 'center', letterSpacing: '2px', fontFamily: 'JetBrains Mono, monospace' }} 
              />
              
              {idErrorDetail && (
                <div style={{ marginTop: '0.5rem', padding: '0.75rem', background: '#fee2e2', borderRadius: '8px', border: '1px solid #fecaca' }}>
                  <div style={{ display: 'flex', gap: '0.5rem', alignItems: 'flex-start' }}>
                    <Icon name="alert-circle" size={16} color="#dc2626" style={{ flexShrink: 0, marginTop: '2px' }} />
                    <div>
                      <div style={{ fontSize: '0.8rem', color: '#dc2626', fontWeight: 500, marginBottom: '0.25rem' }}>{idErrorDetail.message}</div>
                      <div style={{ fontFamily: 'JetBrains Mono, monospace', fontSize: '1rem', letterSpacing: '2px', background: '#fff', padding: '0.25rem 0.5rem', borderRadius: '6px', display: 'inline-block', marginTop: '0.25rem' }}>
                        <span dangerouslySetInnerHTML={{ __html: formatIdWithErrors(idErrorDetail.fullId, idErrorDetail.errorPositions) }} />
                      </div>
                    </div>
                  </div>
                </div>
              )}
              
              {idValid && !idErrorDetail && nationalId.length === 14 && (
                <p style={{ color: 'var(--green)', fontSize: '0.78rem', marginTop: '0.3rem', display: 'flex', alignItems: 'center', gap: '0.3rem' }}>
                  <Icon name="check-circle-2" size={13} color="var(--green)" /> {lang === 'ar' ? 'رقم صالح' : 'Valid ID'}
                </p>
              )}
              
              {idValid && !idErrorDetail && nationalId.length === 14 && (
                <div className="id-card-visual" style={{ marginTop: '1.2rem' }}>
                  <div style={{ fontSize: '0.7rem', opacity: 0.6 }}>{lang === 'ar' ? 'جمهورية مصر العربية — بطاقة الرقم القومي' : 'Arab Republic of Egypt — National ID'}</div>
                  <div className="id-card-num">{nationalId}</div>
                </div>
              )}
              
              <button className="btn-gold" style={{ width: '100%', marginTop: '1.5rem' }} onClick={() => {

                  setIdValid(true);
                  setStep(2);
                }
              }} disabled={nationalId.length !== 14}>
                {lang === 'ar' ? 'التالي ←' : 'Next →'}
              </button>
            </div>
          )}

          {step === 2 && (

              <h3 style={{ fontWeight: 800, marginBottom: '0.3rem', fontSize: '1.2rem' }}>{lang === 'ar' ? 'صوّر الوجه الأمامي للبطاقة' : 'Upload ID Card — Front Side'}</h3>

  // Load Leaflet CSS and JS dynamically when map modal opens
  useEffect(() => {
    if (showMapModal && !window.L) {
      // Load Leaflet CSS
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.css';
      document.head.appendChild(link);
      
      // Load Geocoder CSS
      const geocoderCss = document.createElement('link');
      geocoderCss.rel = 'stylesheet';
      geocoderCss.href = 'https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css';
      document.head.appendChild(geocoderCss);
      
      // Load Leaflet JS
      const script = document.createElement('script');
      script.src = 'https://unpkg.com/leaflet@1.9.4/dist/leaflet.js';
      script.onload = () => {
        // Load Geocoder JS after Leaflet
        const geocoderScript = document.createElement('script');
        geocoderScript.src = 'https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js';
        geocoderScript.onload = () => {
          initMap();
        };
        document.body.appendChild(geocoderScript);
      };
      document.body.appendChild(script);
    } else if (showMapModal && window.L && !window.L.Control.Geocoder) {
      // Load Geocoder if Leaflet exists but Geocoder doesn't
      const geocoderScript = document.createElement('script');
      geocoderScript.src = 'https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js';
      geocoderScript.onload = () => {
        if (mapRef.current) {
          addGeocoderToMap();
        } else {
          initMap();
        }
      };
      document.body.appendChild(geocoderScript);
    } else if (showMapModal && window.L && window.L.Control.Geocoder) {
      setTimeout(() => initMap(), 100);
    }
  }, [showMapModal]);

    const initMap = () => {
    if (!window.L || mapRef.current) return;
    
    const center = (locationLat && locationLng) ? [locationLat, locationLng] : [30.0444, 31.2357];
    
    mapRef.current = window.L.map('mapContainer').setView(center, 15);
    
    window.L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',

    }).addTo(mapRef.current);
    
    if (locationLat && locationLng) {
      markerRef.current = window.L.marker([locationLat, locationLng]).addTo(mapRef.current);
    }

      const { lat, lng } = e.latlng;
      setLocationLat(lat);
      setLocationLng(lng);
      
      if (markerRef.current) {
        markerRef.current.setLatLng([lat, lng]);
      } else {

          const address = data.display_name || `${lat.toFixed(6)}, ${lng.toFixed(6)}`;
          setLocationAddress(address);
          setLocationPinned(true);
        })
        .catch(() => {
          setLocationAddress(`${lat.toFixed(6)}, ${lng.toFixed(6)}`);
          setLocationPinned(true);
        });
    });

  // Check if browser supports speech recognition
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  
  if (!SpeechRecognition) {
    alert(lang === 'ar' ? 'متصفحك لا يدعم التعرف على الصوت' : 'Your browser does not support voice recognition');
    return;
  }
  
  if (isRecording) {
    // Stop recording
    if (recognitionRef.current) {
      recognitionRef.current.stop();
      recognitionRef.current = null;
    }
    setIsRecording(false);
    return;
  }
  
  // Start recording
  const recognition = new SpeechRecognition();
  recognitionRef.current = recognition;
  
  // Set language based on user's language
  recognition.lang = lang === 'ar' ? 'ar-EG' : 'en-US';
  recognition.continuous = true;
  recognition.interimResults = true;
  
  recognition.onstart = () => {
    console.log('Voice recognition started');
    setIsRecording(true);
  };
  
  recognition.onresult = (event) => {
    let interimTranscript = '';
    let finalTranscript = '';
    
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        finalTranscript += transcript;
      } else {
        interimTranscript += transcript;
      }
    }
    
    if (finalTranscript) {
      setDescription(prev => {
        const newText = prev ? prev + ' ' + finalTranscript : finalTranscript;
        return newText;
      });
    }
  };
  
  recognition.onerror = (event) => {
    console.error('Speech recognition error:', event.error);
    setIsRecording(false);
    recognitionRef.current = null;
    
    let errorMessage = lang === 'ar' ? 'حدث خطأ في التعرف على الصوت' : 'Speech recognition error';
    if (event.error === 'not-allowed') {
      errorMessage = lang === 'ar' ? 'الرجاء السماح بالوصول إلى الميكروفون' : 'Please allow microphone access';
    }
    alert(errorMessage);
  };
  
  recognition.onend = () => {
    console.log('Voice recognition ended');
    setIsRecording(false);
    recognitionRef.current = null;
  };
  
  recognition.start();
};

              <div className="chart-title" style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', fontSize: '0.85rem', fontWeight: 700, color: '#e2e8f0', marginBottom: '1.2rem' }}><Icon name="map" size={16} color="#1B6B93" /> {lang === 'ar' ? 'خريطة الكثافة — مصر' : 'Density Map — Egypt'}</div>
              <div className="egypt-map" style={{ width: '100%', height: '220px', background: 'var(--dark3)', borderRadius: '12px', display: 'flex', alignItems: 'center', justifyContent: 'center', position: 'relative', overflow: 'hidden' }}>
                <div style={{ color: '#475569', fontSize: '0.82rem', position: 'absolute', top: '0.8rem', left: '0.8rem', background: 'rgba(0,0,0,0.3)', padding: '0.3rem 0.6rem', borderRadius: '6px' }}>{lang === 'ar' ? 'انقر محافظة للفلترة' : 'Click governate to filter'}</div>
                {[
                  { x: '48%', y: '28%', size: 80 }, { x: '44%', y: '30%', size: 60 }, { x: '25%', y: '20%', size: 50 },
                  { x: '55%', y: '35%', size: 40 }, { x: '50%', y: '45%', size: 30 }, { x: '52%', y: '55%', size: 20 }
                ].map((d, i) => (<div key={i} className="map-heat-dot" style={{ position: 'absolute', left: d.x, top: d.y, width: d.size, height: d.size, borderRadius: '50%', background: 'radial-gradient(circle, rgba(220,38,38,0.5) 0%, transparent 70%)', transform: 'translate(-50%,-50%)' }} />))}
                <div style={{ opacity: 0.15 }}><Icon name="map" size={48} color="#64748b" /></div>
                <p style={{ color: '#475569', fontSize: '0.8rem', position: 'absolute', bottom: '0.8rem' }}>{lang === 'ar' ? 'القاهرة: 247 شكوى | الجيزة: 128 | الإسكندرية: 94' : 'Cairo: 247 | Giza: 128 | Alexandria: 94'}</p>
              </div>
            </div>

            <div className="chart-card" style={{ background: 'var(--dark2)', borderRadius: '14px', padding: '1.5rem', border: '1px solid rgba(255,255,255,0.06)' }}>
              <div className="chart-title" style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', fontSize: '0.85rem', fontWeight: 700, color: '#e2e8f0', marginBottom: '1.2rem' }}><Icon name="line-chart" size={16} color="#1B6B93" /> {lang === 'ar' ? 'اتجاهات آخر 30 يوم' : 'Trends — Last 30 Days'}</div>
              <svg viewBox="0 0 300 100" style={{ width: '100%', height: 110 }}>
                <defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="#1B6B93" stopOpacity="0.4" /><stop offset="100%" stopColor="#1B6B93" stopOpacity="0" /></linearGradient></defs>
                <path d="M0,80 L30,65 L60,70 L90,50 L120,55 L150,35 L180,40 L210,25 L240,30 L270,15 L300,20" fill="none" stroke="#1B6B93" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                <path d="M0,80 L30,65 L60,70 L90,50 L120,55 L150,35 L180,40 L210,25 L240,30 L270,15 L300,20 L300,100 L0,100 Z" fill="url(#trendGrad)" />
                <path d="M0,90 L30,82 L60,85 L90,75 L120,72 L150,65 L180,68 L210,60 L240,62 L270,55 L300,58" fill="none" stroke="#D4AF37" strokeWidth="1.5" strokeDasharray="4,2" />
                <circle cx="270" cy="15" r="4" fill="#1B6B93" /><circle cx="270" cy="55" r="3" fill="#D4AF37" />
              </svg>
              <div style={{ display: 'flex', gap: '1.2rem', marginTop: '0.5rem' }}>
                <div className="legend-item"><div className="legend-dot" style={{ background: '#1B6B93' }} /><span style={{ fontSize: '0.75rem', color: '#94a3b8' }}>{lang === 'ar' ? 'الشكاوى' : 'Complaints'}</span></div>
                <div className="legend-item"><div className="legend-dot" style={{ background: '#D4AF37' }} /><span style={{ fontSize: '0.75rem', color: '#94a3b8' }}>{lang === 'ar' ? 'المحلولة' : 'Resolved'}</span></div>
              </div>
            </div>
          </div>

          <div className="chart-card" style={{ background: 'var(--dark2)', borderRadius: '14px', padding: '1.5rem', border: '1px solid rgba(255,255,255,0.06)' }}>
            <div className="chart-title" style={{ display: 'flex', alignItems: 'center', gap: '0.5rem', fontSize: '0.85rem', fontWeight: 700, color: '#e2e8f0', marginBottom: '1.2rem' }}>
              <Icon name="circle" size={12} color="var(--red)" style={{ animation: 'pulse 1.5s infinite' }} />
              {lang === 'ar' ? 'الشكاوى ذات الأولوية القصوى' : 'Top Priority Complaints'}
            </div>
            {priorityQueue.map((p, i) => (
              <div key={i} className="priority-card" style={{ background: 'var(--dark2)', borderRadius: '10px', padding: '1rem', border: '1px solid rgba(255,255,255,0.06)', marginBottom: '0.75rem', display: 'flex', alignItems: 'center', gap: '1rem', transition: 'all 0.2s', cursor: 'pointer' }}>
                <div className="priority-score" style={{ width: '46px', height: '46px', borderRadius: '10px', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: '1rem', fontWeight: 900, fontFamily: 'JetBrains Mono, monospace', background: p.color + '20', color: p.color }}>{p.score}</div>
                <div className="priority-content" style={{ flex: 1, minWidth: 0 }}>
                  <div className="priority-title" style={{ fontSize: '0.85rem', fontWeight: 700, color: '#e2e8f0' }}>{p.title}</div>
                  <div className="priority-meta" style={{ display: 'flex', alignItems: 'center', gap: '0.35rem', flexWrap: 'wrap', fontSize: '0.75rem', color: '#64748b', marginTop: '0.2rem' }}>
                    <Icon name="map-pin" size={13} /><span>{p.location}</span><span style={{ opacity: 0.6 }}>·</span><Icon name="tag" size={13} /><span>{p.cat}</span>
                  </div>
                </div>
                <div className="priority-thumb" style={{ width: '46px', height: '46px', borderRadius: '8px', background: 'var(--dark3)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{i % 2 === 0 ? <Icon name="camera" size={20} color="#64748b" /> : <Icon name="video" size={20} color="#64748b" />}</div>
                <button style={{ padding: '0.4rem 0.8rem', background: 'var(--nile)', border: 'none', borderRadius: '8px', color: '#fff', fontFamily: 'Cairo', fontSize: '0.75rem', fontWeight: 700, cursor: 'pointer', whiteSpace: 'nowrap', flexShrink: 0, display: 'inline-flex', alignItems: 'center', gap: '0.4rem' }}>
                  {lang === 'ar' ? 'تعيين' : 'Assign'}
                  <Icon name={lang === 'ar' ? 'arrow-left' : 'arrow-right'} size={13} color="#fff" />
                </button>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── APP ROOT ───
function App() {
  const [page, setPage] = useState('home');
  const [lang, setLang] = useState('ar');

  const renderPage = () => {
    switch(page) {
      case 'home': return <HomePage setPage={setPage} lang={lang} />;
      case 'register': return <RegisterPage setPage={setPage} lang={lang} />;
       case 'login': return <LoginPage setPage={setPage} lang={lang} />;  // ← ADD THIS
      case 'submit': return <SubmitPage setPage={setPage} lang={lang} />;
      case 'dashboard': return <DashboardPage setPage={setPage} lang={lang} />;
      case 'admin': return <AdminPage lang={lang} />;
      default: return <HomePage setPage={setPage} lang={lang} />;
    }
  };

  return (
    <div dir={lang === 'ar' ? 'rtl' : 'ltr'}>
      <Navbar page={page} setPage={setPage} lang={lang} setLang={setLang} />
      {renderPage()}
    </div>
  );
}

const __root = ReactDOM.createRoot(document.getElementById('root'));
__root.render(<App />);
</script>
</body>
</html>
