<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shakwa | Dashboard</title>

  <!-- FONTS -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <!-- STYLES -->
  <link rel="stylesheet" href="style.css" />

  <!-- REACT -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>

  <!-- Icons are self-contained SVG in shared.js — no external library needed -->

  <!--
    BACKEND INTEGRATION — User Dashboard (pages.js DashboardPage)
    ══════════════════════════════════════════════════════════════
    ON MOUNT:
      1. Verify JWT from httpOnly cookie → redirect to /register if expired
      2. Fetch user profile: GET /api/users/me
           Returns: { name, national_id_masked, governate, avatar_url }
      3. Fetch user complaints: GET /api/complaints?user_id=me&page=1&limit=20
           Returns: { complaints: [...], total: int, pages: int }
         Currently using static COMPLAINTS_DATA from shared.js — replace with API call

    REAL-TIME UPDATES (Kanban status changes):
      Connect a WebSocket: ws://your-backend/ws/complaints?token=<jwt>
      On message: { type: "status_update", complaint_id, new_status }
        → Update the complaint card in state without re-fetching

    STATUS CHANGE:
      PATCH /api/complaints/:id/status
        Body: { status: "submitted" | "review" | "progress" | "resolved" }
      This is triggered by admin actions, not the user directly

    NOTIFICATIONS:
      GET /api/notifications?user_id=me&unread=true
      Mark read: PATCH /api/notifications/:id  { read: true }

    ML FEATURES ON THIS PAGE:
      - Priority score display: already calculated by backend on submission
      - Predicted resolution time: GET /api/complaints/:id/prediction
          Returns: { estimated_days: int, confidence: float }
  -->
</head>
<body data-page="dashboard">
  <div id="root"></div>
  <script type="text/babel" src="shared.js"></script>
  <script type="text/babel" src="pages.js"></script>
</body>
</html>
