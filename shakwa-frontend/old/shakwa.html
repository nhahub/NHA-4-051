<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>شكوى | Shekwa — صوتك مسموع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&family=Playfair+Display:wght@700;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.development.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <!-- Cloudflare Turnstile — bot protection on registration step 4
       Add your Site Key below. Verify token server-side at /api/register -->

<style>
:root {
  --nile: #1B6B93;
  --nile-dark: #0d4a6b;
  --nile-light: #2a8ab8;
  --gold: #D4AF37;
  --gold-light: #e8c84a;
  --sand: #F5E8C7;
  --papyrus: #F9F5EB;
  --green: #2E8B57;
  --green-light: #3aad6c;
  --pink: #E6A8D7;
  --dark: #0F172A;
  --dark2: #1E293B;
  --dark3: #2d3d52;
  --text-dark: #1a2634;
  --text-mid: #4a6275;
  --red: #DC2626;
  --shadow-gold: 0 8px 32px rgba(212,175,55,0.25);
  --shadow-nile: 0 8px 32px rgba(27,107,147,0.25);
  --shadow-card: 0 4px 24px rgba(0,0,0,0.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Cairo', sans-serif;
  background: var(--papyrus);
  color: var(--text-dark);
  overflow-x: hidden;
}
/* ─── SCROLLBAR ─── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: var(--sand); }
::-webkit-scrollbar-thumb { background: var(--nile); border-radius: 3px; }

/* ─── ANIMATIONS ─── */
@keyframes fadeUp { from { opacity: 0; transform: translateY(32px); } to { opacity: 1; transform: translateY(0); } }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes shimmer { 0% { background-position: -200% center; } 100% { background-position: 200% center; } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes float { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-12px); } }
@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
@keyframes slideInRight { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes slideInLeft { from { opacity: 0; transform: translateX(-40px); } to { opacity: 1; transform: translateX(0); } }
@keyframes countUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes waveMove { 0%,100% { d: path("M0,40 C150,80 350,0 500,40 L500,100 L0,100 Z"); } 50% { d: path("M0,60 C150,20 350,80 500,60 L500,100 L0,100 Z"); } }
@keyframes borderGlow { 0%,100% { box-shadow: 0 0 0 0 rgba(212,175,55,0); } 50% { box-shadow: 0 0 0 4px rgba(212,175,55,0.3); } }
@keyframes stepPop { from { opacity:0; transform: scale(0.8); } to { opacity:1; transform: scale(1); } }
@keyframes notifSlide { from { opacity:0; transform: translateX(100px); } to { opacity:1; transform: translateX(0); } }
@keyframes kanbanPulse { 0%,100% { box-shadow: var(--shadow-card); } 50% { box-shadow: 0 8px 32px rgba(27,107,147,0.2); } }

.fade-up { animation: fadeUp 0.6s cubic-bezier(.22,.68,0,1.2) both; }
.fade-in { animation: fadeIn 0.5s ease both; }

/* ─── NAVBAR ─── */
.navbar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(15,23,42,0.92);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(212,175,55,0.15);
  padding: 0 2rem;
  height: 68px;
  display: flex; align-items: center; justify-content: space-between;
  transition: all 0.3s;
}
.navbar-brand {
  font-size: 1.6rem; font-weight: 900; color: var(--gold);
  letter-spacing: -0.5px; cursor: pointer;
  display: flex; align-items: center; gap: 0.5rem;
}
.navbar-brand span { color: #fff; font-weight: 300; font-size: 1rem; }
.nav-links { display: flex; align-items: center; gap: 0.5rem; }
.nav-btn {
  padding: 0.45rem 1.1rem; border-radius: 8px; border: none;
  font-family: 'Cairo', sans-serif; font-size: 0.88rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s;
}
.nav-btn.ghost { background: transparent; color: #ccc; }
.nav-btn.ghost:hover { color: #fff; background: rgba(255,255,255,0.08); }
.nav-btn.primary { background: var(--gold); color: var(--dark); }
.nav-btn.primary:hover { background: var(--gold-light); transform: translateY(-1px); }
.nav-btn.outline { background: transparent; color: var(--nile-light); border: 1px solid var(--nile-light); }
.nav-btn.outline:hover { background: var(--nile); color: #fff; }
.lang-toggle {
  padding: 0.35rem 0.9rem; border-radius: 20px;
  background: rgba(27,107,147,0.2); color: var(--nile-light);
  border: 1px solid rgba(27,107,147,0.4);
  font-family: 'Cairo', sans-serif; font-size: 0.82rem; font-weight: 700;
  cursor: pointer; transition: all 0.2s;
}
.lang-toggle:hover { background: var(--nile); color: #fff; }

/* ─── HERO ─── */
.hero {
  min-height: 100vh;
  background: linear-gradient(135deg, #0d1b2a 0%, #0F172A 40%, #1a2f45 70%, #0d2e1e 100%);
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center; padding: 7rem 2rem 4rem;
  position: relative; overflow: hidden;
}
.hero-pattern {
  position: absolute; inset: 0; opacity: 0.04;
  background-image: repeating-linear-gradient(45deg, var(--gold) 0, var(--gold) 1px, transparent 0, transparent 50%);
  background-size: 24px 24px;
}
.hero-glow {
  position: absolute; width: 600px; height: 600px; border-radius: 50%;
  background: radial-gradient(circle, rgba(27,107,147,0.18) 0%, transparent 70%);
  top: 50%; left: 50%; transform: translate(-50%,-50%);
  pointer-events: none;
}
.hero-badge {
  display: inline-flex; align-items: center; gap: 0.5rem;
  background: rgba(212,175,55,0.12); border: 1px solid rgba(212,175,55,0.3);
  color: var(--gold); padding: 0.4rem 1.2rem; border-radius: 30px;
  font-size: 0.82rem; font-weight: 600; margin-bottom: 1.8rem;
  animation: fadeUp 0.5s ease both;
}
.hero-title {
  font-size: clamp(2.4rem, 6vw, 4.2rem);
  font-weight: 900; color: #fff; line-height: 1.15;
  margin-bottom: 1.2rem;
  animation: fadeUp 0.6s 0.1s ease both;
}
.hero-title .gold { color: var(--gold); }
.hero-title .nile { color: var(--nile-light); }
.hero-sub {
  font-size: 1.1rem; color: #94a3b8; max-width: 560px;
  line-height: 1.8; margin-bottom: 2.4rem;
  animation: fadeUp 0.6s 0.2s ease both;
}
.hero-cta { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; animation: fadeUp 0.6s 0.3s ease both; }
.btn-gold {
  padding: 0.9rem 2.2rem; background: var(--gold); color: var(--dark);
  border: none; border-radius: 12px; font-family: 'Cairo', sans-serif;
  font-size: 1rem; font-weight: 800; cursor: pointer;
  transition: all 0.25s; box-shadow: var(--shadow-gold);
}
.btn-gold:hover { background: var(--gold-light); transform: translateY(-2px); box-shadow: 0 12px 40px rgba(212,175,55,0.4); }
.btn-ghost-white {
  padding: 0.9rem 2.2rem; background: rgba(255,255,255,0.07);
  color: #fff; border: 1px solid rgba(255,255,255,0.2);
  border-radius: 12px; font-family: 'Cairo', sans-serif;
  font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.25s;
}
.btn-ghost-white:hover { background: rgba(255,255,255,0.13); transform: translateY(-2px); }

/* Stats bar */
.stats-bar {
  margin-top: 4rem;
  display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 1px; background: rgba(255,255,255,0.08);
  border-radius: 16px; overflow: hidden;
  width: 100%; max-width: 640px;
  animation: fadeUp 0.6s 0.4s ease both;
}
.stat-item {
  background: rgba(255,255,255,0.04);
  padding: 1.4rem 1rem; text-align: center;
}
.stat-num { font-size: 1.8rem; font-weight: 900; color: var(--gold); }
.stat-label { font-size: 0.78rem; color: #64748b; margin-top: 0.2rem; }

/* Floating icons */
.float-icon {
  position: absolute; font-size: 2rem; opacity: 0.08;
  animation: float 4s ease-in-out infinite;
  pointer-events: none;
}

/* ─── SECTION HEADERS ─── */
.section { padding: 5rem 2rem; }
.section-tag {
  display: inline-block; background: rgba(27,107,147,0.1);
  color: var(--nile); padding: 0.3rem 1rem; border-radius: 20px;
  font-size: 0.8rem; font-weight: 700; margin-bottom: 0.8rem;
  border: 1px solid rgba(27,107,147,0.2);
}
.section-title { font-size: clamp(1.6rem, 3.5vw, 2.4rem); font-weight: 900; color: var(--text-dark); margin-bottom: 0.6rem; }
.section-sub { color: var(--text-mid); font-size: 1rem; line-height: 1.8; max-width: 560px; }

/* Features grid */
.features-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: 1.5rem; margin-top: 3rem;
}
.feature-card {
  background: #fff; border-radius: 16px; padding: 1.8rem;
  border: 1px solid rgba(0,0,0,0.06);
  transition: all 0.3s; cursor: default;
  position: relative; overflow: hidden;
}
.feature-card::before {
  content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
  background: linear-gradient(90deg, var(--nile), var(--gold));
  transform: scaleX(0); transform-origin: left; transition: transform 0.3s;
}
.feature-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-card); }
.feature-card:hover::before { transform: scaleX(1); }
.feature-icon { font-size: 2rem; margin-bottom: 1rem; }
.feature-title { font-size: 1rem; font-weight: 700; margin-bottom: 0.5rem; }
.feature-desc { font-size: 0.85rem; color: var(--text-mid); line-height: 1.7; }

/* ─── PAGE CONTAINER ─── */
.page { padding-top: 68px; min-height: 100vh; }

/* ─── FORM STYLES ─── */
.form-card {
  background: #fff; border-radius: 20px; padding: 2.5rem;
  box-shadow: var(--shadow-card); border: 1px solid rgba(0,0,0,0.06);
}
.form-label { font-size: 0.85rem; font-weight: 700; color: var(--text-dark); margin-bottom: 0.5rem; display: block; }
.form-input {
  width: 100%; padding: 0.75rem 1rem; border-radius: 10px;
  border: 1.5px solid #e2e8f0; font-family: 'Cairo', sans-serif;
  font-size: 0.95rem; transition: all 0.2s; background: var(--papyrus);
  outline: none; color: var(--text-dark);
}
.form-input:focus { border-color: var(--nile); background: #fff; box-shadow: 0 0 0 3px rgba(27,107,147,0.1); }
.form-input::placeholder { color: #94a3b8; }
.form-input.error { border-color: var(--red); }
.form-select {
  width: 100%; padding: 0.75rem 1rem; border-radius: 10px;
  border: 1.5px solid #e2e8f0; font-family: 'Cairo', sans-serif;
  font-size: 0.95rem; background: var(--papyrus); color: var(--text-dark);
  outline: none; cursor: pointer; transition: all 0.2s;
  appearance: none;
}
.form-select:focus { border-color: var(--nile); box-shadow: 0 0 0 3px rgba(27,107,147,0.1); }
.form-textarea {
  width: 100%; padding: 0.75rem 1rem; border-radius: 10px;
  border: 1.5px solid #e2e8f0; font-family: 'Cairo', sans-serif;
  font-size: 0.95rem; resize: vertical; min-height: 120px;
  background: var(--papyrus); color: var(--text-dark); outline: none; transition: all 0.2s;
}
.form-textarea:focus { border-color: var(--nile); background: #fff; box-shadow: 0 0 0 3px rgba(27,107,147,0.1); }

/* Step indicator */
.steps-bar { display: flex; align-items: center; gap: 0; margin-bottom: 2.5rem; }
.step-dot {
  width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 0.85rem; transition: all 0.3s; flex-shrink: 0;
}
.step-dot.done { background: var(--green); color: #fff; }
.step-dot.active { background: var(--nile); color: #fff; animation: borderGlow 2s ease infinite; }
.step-dot.pending { background: #e2e8f0; color: #94a3b8; }
.step-line { flex: 1; height: 2px; background: #e2e8f0; transition: all 0.3s; }
.step-line.done { background: var(--green); }

/* Upload zone */
.upload-zone {
  border: 2px dashed #cbd5e1; border-radius: 14px; padding: 2.5rem;
  text-align: center; cursor: pointer; transition: all 0.2s; background: var(--papyrus);
}
.upload-zone:hover { border-color: var(--nile); background: rgba(27,107,147,0.03); }
.upload-zone.drag { border-color: var(--gold); background: rgba(212,175,55,0.04); }

/* Selfie circle */
.selfie-circle {
  width: 200px; height: 200px; border-radius: 50%;
  background: linear-gradient(135deg, var(--nile-dark), var(--nile));
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1rem; font-size: 4rem; position: relative;
  box-shadow: 0 0 0 4px var(--sand), 0 0 0 8px rgba(27,107,147,0.2);
  animation: float 3s ease-in-out infinite;
}
.selfie-pulse {
  position: absolute; inset: -8px; border-radius: 50%;
  border: 2px solid rgba(27,107,147,0.3);
  animation: pulse 2s ease-in-out infinite;
}

/* Map placeholder */
.map-placeholder {
  width: 100%; height: 280px; border-radius: 14px;
  background: linear-gradient(135deg, #1a2f45, #0d2e1e);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  position: relative; overflow: hidden; cursor: pointer;
  border: 1.5px solid rgba(27,107,147,0.3);
}
.map-grid {
  position: absolute; inset: 0; opacity: 0.1;
  background-image: linear-gradient(rgba(27,107,147,0.5) 1px, transparent 1px),
    linear-gradient(90deg, rgba(27,107,147,0.5) 1px, transparent 1px);
  background-size: 30px 30px;
}
.map-pin { font-size: 2.5rem; animation: float 2s ease-in-out infinite; z-index: 1; }

/* Category chips */
.chips-wrap { display: flex; flex-wrap: wrap; gap: 0.5rem; margin-top: 0.8rem; }
.chip {
  padding: 0.35rem 1rem; border-radius: 20px; font-size: 0.82rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s; border: 1.5px solid;
}
.chip.default { border-color: #e2e8f0; color: var(--text-mid); background: #fff; }
.chip.default:hover { border-color: var(--nile); color: var(--nile); }
.chip.selected { border-color: var(--green); color: var(--green); background: rgba(46,139,87,0.08); }

/* Sentiment bar */
.sentiment-bar {
  display: flex; align-items: center; gap: 0.8rem;
  padding: 0.7rem 1rem; background: var(--sand); border-radius: 10px; margin-top: 0.5rem;
}
.sentiment-emoji { font-size: 1.5rem; transition: all 0.3s; }
.sentiment-label { font-size: 0.82rem; font-weight: 700; }

/* ─── KANBAN ─── */
.kanban-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2rem; }
.kanban-col { border-radius: 14px; padding: 1rem; background: var(--sand); }
.kanban-col-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 1rem; padding-bottom: 0.7rem;
  border-bottom: 2px solid rgba(0,0,0,0.07);
}
.kanban-col-title { font-size: 0.85rem; font-weight: 800; }
.kanban-badge {
  width: 22px; height: 22px; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; font-size: 0.72rem; font-weight: 800; color: #fff;
}
.complaint-card {
  background: #fff; border-radius: 10px; padding: 1rem;
  margin-bottom: 0.75rem; border: 1px solid rgba(0,0,0,0.06);
  cursor: grab; transition: all 0.2s; animation: kanbanPulse 4s ease infinite;
}
.complaint-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-card); animation: none; }
.card-category-chip {
  display: inline-block; padding: 0.15rem 0.6rem;
  border-radius: 10px; font-size: 0.72rem; font-weight: 700; margin-bottom: 0.5rem;
}
.card-title { font-size: 0.85rem; font-weight: 700; margin-bottom: 0.3rem; }
.card-meta { font-size: 0.72rem; color: var(--text-mid); }
.card-priority {
  display: inline-flex; align-items: center; gap: 0.2rem;
  font-size: 0.72rem; font-weight: 700; padding: 0.15rem 0.5rem;
  border-radius: 8px; margin-top: 0.4rem;
}

/* ─── ADMIN DASHBOARD ─── */
.admin-layout { display: grid; grid-template-columns: 240px 1fr; min-height: calc(100vh - 68px); }
.admin-sidebar {
  background: var(--dark); padding: 1.5rem 1rem;
  border-left: 1px solid rgba(255,255,255,0.06);
}
.sidebar-logo {
  font-size: 1.2rem; font-weight: 900; color: var(--gold);
  padding: 0.5rem 0 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.08);
  margin-bottom: 1.5rem;
}
.sidebar-section { font-size: 0.7rem; font-weight: 700; color: #475569; text-transform: uppercase; letter-spacing: 1px; padding: 0 0.5rem; margin: 1.2rem 0 0.5rem; }
.sidebar-item {
  display: flex; align-items: center; gap: 0.7rem;
  padding: 0.65rem 0.8rem; border-radius: 10px;
  color: #94a3b8; font-size: 0.88rem; font-weight: 600;
  cursor: pointer; transition: all 0.2s; margin-bottom: 0.2rem;
}
.sidebar-item:hover { background: rgba(255,255,255,0.06); color: #fff; }
.sidebar-item.active { background: rgba(27,107,147,0.2); color: var(--nile-light); }
.sidebar-item .icon { font-size: 1.1rem; width: 22px; text-align: center; }
.admin-main { background: #0d1b2a; padding: 2rem; overflow-y: auto; }
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
.kpi-card {
  background: var(--dark2); border-radius: 14px; padding: 1.4rem;
  border: 1px solid rgba(255,255,255,0.06); position: relative; overflow: hidden;
}
.kpi-card::after {
  content: ''; position: absolute; bottom: -20px; right: -20px;
  width: 80px; height: 80px; border-radius: 50%;
  background: rgba(255,255,255,0.03);
}
.kpi-label { font-size: 0.75rem; color: #64748b; font-weight: 600; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 0.5px; }
.kpi-value { font-size: 2rem; font-weight: 900; margin-bottom: 0.2rem; }
.kpi-change { font-size: 0.78rem; font-weight: 600; }
.kpi-icon { position: absolute; top: 1.2rem; left: 1.2rem; font-size: 1.5rem; opacity: 0.6; }
.charts-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; margin-bottom: 1.5rem; }
.chart-card {
  background: var(--dark2); border-radius: 14px; padding: 1.5rem;
  border: 1px solid rgba(255,255,255,0.06);
}
.chart-title { font-size: 0.85rem; font-weight: 700; color: #e2e8f0; margin-bottom: 1.2rem; }

/* Bar chart */
.bar-chart { display: flex; align-items: flex-end; gap: 0.6rem; height: 120px; }
.bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 0.3rem; }
.bar {
  width: 100%; border-radius: 6px 6px 0 0; transition: all 0.5s ease;
  position: relative; cursor: pointer;
}
.bar:hover { filter: brightness(1.2); }
.bar-label { font-size: 0.65rem; color: #64748b; text-align: center; }
.bar-val { font-size: 0.7rem; color: #94a3b8; font-weight: 700; }

/* Donut chart */
.donut-wrap { display: flex; align-items: center; gap: 1.5rem; }
.donut-svg { flex-shrink: 0; }
.donut-legend { display: flex; flex-direction: column; gap: 0.5rem; }
.legend-item { display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: #94a3b8; }
.legend-dot { width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }

/* Priority queue */
.priority-card {
  background: var(--dark2); border-radius: 10px; padding: 1rem;
  border: 1px solid rgba(255,255,255,0.06); margin-bottom: 0.75rem;
  display: flex; align-items: center; gap: 1rem;
  transition: all 0.2s; cursor: pointer;
}
.priority-card:hover { border-color: rgba(27,107,147,0.4); background: var(--dark3); }
.priority-score {
  width: 46px; height: 46px; border-radius: 10px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 1rem; font-weight: 900; font-family: 'JetBrains Mono', monospace;
}
.priority-content { flex: 1; min-width: 0; }
.priority-title { font-size: 0.85rem; font-weight: 700; color: #e2e8f0; }
.priority-meta { font-size: 0.75rem; color: #64748b; margin-top: 0.2rem; }
.priority-thumb { width: 46px; height: 46px; border-radius: 8px; background: var(--dark3); display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

/* Map heatmap placeholder */
.egypt-map {
  width: 100%; height: 220px; background: var(--dark3);
  border-radius: 12px; display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.map-heat-dot {
  position: absolute; border-radius: 50%;
  background: radial-gradient(circle, rgba(220,38,38,0.5) 0%, transparent 70%);
  pointer-events: none;
}

/* Notification toast */
.toast {
  position: fixed; bottom: 2rem; left: 2rem; z-index: 9999;
  background: var(--dark2); color: #e2e8f0; padding: 1rem 1.5rem;
  border-radius: 12px; border-left: 4px solid var(--green);
  box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  animation: notifSlide 0.4s cubic-bezier(.22,.68,0,1.2) both;
  font-size: 0.88rem; font-weight: 600; max-width: 300px;
}

/* Loading spinner */
.spinner {
  width: 40px; height: 40px; border: 3px solid rgba(27,107,147,0.2);
  border-top-color: var(--nile); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto;
}

/* Progress bar */
.progress-wrap { background: #e2e8f0; border-radius: 10px; height: 8px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 10px; transition: width 0.5s ease; }

/* Badges */
.badge {
  display: inline-block; padding: 0.2rem 0.7rem; border-radius: 20px;
  font-size: 0.72rem; font-weight: 700;
}
.badge-submitted { background: rgba(27,107,147,0.12); color: var(--nile); }
.badge-review { background: rgba(212,175,55,0.12); color: var(--gold); }
.badge-progress { background: rgba(230,168,215,0.2); color: #c084fc; }
.badge-resolved { background: rgba(46,139,87,0.12); color: var(--green); }
.badge-high { background: rgba(220,38,38,0.12); color: var(--red); }

/* Voice button */
.voice-btn {
  width: 48px; height: 48px; border-radius: 50%; border: none;
  background: linear-gradient(135deg, var(--nile), var(--nile-dark));
  color: #fff; font-size: 1.1rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; box-shadow: var(--shadow-nile);
  flex-shrink: 0;
}
.voice-btn:hover { transform: scale(1.1); }
.voice-btn.recording { background: linear-gradient(135deg, var(--red), #b91c1c); animation: pulse 1s ease-in-out infinite; }

/* Gallery grid */
.evidence-gallery { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.6rem; margin-top: 0.8rem; }
.evidence-thumb {
  aspect-ratio: 1; border-radius: 10px; background: var(--sand);
  display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; position: relative; overflow: hidden;
  border: 1.5px solid #e2e8f0; cursor: pointer;
}
.evidence-thumb .remove-btn {
  position: absolute; top: 4px; right: 4px; width: 20px; height: 20px;
  border-radius: 50%; background: rgba(220,38,38,0.8); color: #fff;
  border: none; font-size: 0.7rem; cursor: pointer; display: flex;
  align-items: center; justify-content: center;
}

/* Alert */
.alert {
  padding: 0.9rem 1.2rem; border-radius: 10px; font-size: 0.88rem;
  font-weight: 600; margin-bottom: 1rem; display: flex; align-items: flex-start; gap: 0.6rem;
}
.alert-info { background: rgba(27,107,147,0.08); color: var(--nile); border: 1px solid rgba(27,107,147,0.2); }
.alert-success { background: rgba(46,139,87,0.08); color: var(--green); border: 1px solid rgba(46,139,87,0.2); }
.alert-warning { background: rgba(212,175,55,0.08); color: #b07d0f; border: 1px solid rgba(212,175,55,0.2); }

/* Divider */
.divider { height: 1px; background: linear-gradient(90deg, transparent, #e2e8f0, transparent); margin: 2rem 0; }

/* Grid helpers */
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
.grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.2rem; }

/* How it works */
.how-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-top: 3rem; counter-reset: steps; }
.how-card {
  background: #fff; border-radius: 16px; padding: 2rem 1.5rem;
  text-align: center; border: 1px solid rgba(0,0,0,0.06);
  transition: all 0.3s; position: relative;
}
.how-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-card); }
.how-num {
  width: 40px; height: 40px; border-radius: 12px;
  background: linear-gradient(135deg, var(--nile), var(--nile-dark));
  color: #fff; font-weight: 900; font-size: 0.9rem;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 1rem;
}
.how-icon { font-size: 2rem; margin-bottom: 0.7rem; }
.how-title { font-size: 0.95rem; font-weight: 800; margin-bottom: 0.4rem; }
.how-desc { font-size: 0.82rem; color: var(--text-mid); line-height: 1.7; }

/* Review summary */
.review-row {
  display: flex; justify-content: space-between; align-items: flex-start;
  padding: 0.75rem 0; border-bottom: 1px solid #f1f5f9; font-size: 0.88rem;
}
.review-row:last-child { border-bottom: none; }
.review-label { color: var(--text-mid); font-weight: 600; }
.review-value { font-weight: 700; text-align: left; max-width: 60%; }

/* Footer */
.footer {
  background: var(--dark); color: #475569; padding: 3rem 2rem;
  text-align: center; font-size: 0.82rem; border-top: 1px solid rgba(255,255,255,0.04);
}
.footer .brand { color: var(--gold); font-weight: 800; font-size: 1.1rem; }

/* Responsive */
@media (max-width: 768px) {
  .admin-layout { grid-template-columns: 1fr; }
  .admin-sidebar { display: none; }
  .charts-grid { grid-template-columns: 1fr; }
  .grid-2, .grid-3 { grid-template-columns: 1fr; }
  .hero-title { font-size: 2rem; }
  .stats-bar { grid-template-columns: 1fr; gap: 0; }
}

/* Transition page wrapper */
.page-transition { animation: fadeIn 0.35s ease both; }

/* Checkbox */
.checkbox-wrap { display: flex; align-items: flex-start; gap: 0.7rem; cursor: pointer; }
.checkbox-input { width: 18px; height: 18px; accent-color: var(--nile); cursor: pointer; flex-shrink: 0; margin-top: 2px; }
.checkbox-text { font-size: 0.88rem; color: var(--text-mid); line-height: 1.6; }

/* ID card visual */
.id-card-visual {
  background: linear-gradient(135deg, #1a3a5c, #0d2a42);
  border-radius: 14px; padding: 1.2rem 1.5rem;
  color: #fff; font-size: 0.8rem; position: relative; overflow: hidden;
  border: 1px solid rgba(255,255,255,0.1);
}
.id-card-visual::before {
  content: '›'; position: absolute; right: 1rem; top: 50%; transform: translateY(-50%);
  font-size: 3rem; opacity: 0.08;
}
.id-card-num { font-family: 'JetBrains Mono', monospace; font-size: 1.1rem; font-weight: 600; letter-spacing: 2px; color: var(--gold); margin-top: 0.3rem; }

/* Score ring animation */
.score-ring { transition: stroke-dashoffset 1s ease; }

  return React.createElement('span', {
    dangerouslySetInnerHTML: { __html: svg },
    style: { display: 'inline-flex', alignItems: 'center', lineHeight: 1, verticalAlign: 'middle', flexShrink: 0, ...(style || {}) }
  });
}

function getSentiment(text) {
  // ML INTEGRATION: Replace with POST /api/ml/sentiment → { sentiment: 'negative'|'neutral', confidence: float }
  // Only 'negative' and 'neutral' — positive removed from complaint system intentionally
  const negative = ['معطل', 'خطير', 'سيء', 'مشكلة', 'ضعيف', 'broken', 'bad', 'terrible', 'horrible', 'dangerous', 'انقطع', 'تراكم', 'حفرة', 'مظلم', 'تلف', 'مكسور', 'انقطاع'];
  const txt = String(text || '').toLowerCase();
  if (negative.some(w => txt.includes(w))) return 'negative';
  if (txt.length > 20) return 'neutral';
  return 'none';
}

  // Complaint system: only negative/neutral. 'positive' removed intentionally.

                  {idValid && <p style={{ color: 'var(--green)', fontSize: '0.78rem', marginTop: '0.3rem', display: 'flex', alignItems: 'center', gap: '0.3rem' }}><LucideIcon name="check-circle-2" size={13} color="var(--green)" /> {lang === 'ar' ? 'رقم صالح' : 'Valid ID'}</p>}
                </div>
              </div>

              {idValid && (
                <div className="id-card-visual" style={{ marginTop: '1.2rem' }}>
                  <div style={{ fontSize: '0.7rem', opacity: 0.6 }}>{lang === 'ar' ? 'جمهورية مصر العربية — بطاقة الرقم القومي' : 'Arab Republic of Egypt — National ID'}</div>
                  <div className="id-card-num">{nationalId}</div>
                  <div style={{ fontSize: '0.7rem', opacity: 0.5, marginTop: '0.3rem' }}>
                    {lang === 'ar' ? 'المحافظة: القاهرة' : 'Governate: Cairo'}
                  </div>
                </div>
              )}

              <div className="alert alert-info" style={{ marginTop: '1.2rem' }}>
                <span>ℹ️</span><span>{t.s1hint}</span>
              </div>
              <button className="btn-gold" style={{ width: '100%', marginTop: '1.5rem' }} onClick={() => idValid && setStep(2)} disabled={!idValid}>
                {lang === 'ar' ? 'التالي ←' : 'Next →'}
              </button>
            </div>
          )}

          {/* STEP 2 */}
          {step === 2 && (
            <div>
              <h3 style={{ fontWeight: 800, marginBottom: '0.3rem', fontSize: '1.2rem' }}>{t.s2title}</h3>
              <p style={{ color: 'var(--text-mid)', fontSize: '0.85rem', marginBottom: '1.8rem' }}>
                {lang === 'ar' ? 'خطوتان للتحقق من هويتك بأمان تام' : 'Two steps to verify your identity securely'}
              </p>
              <div className="grid-2">
                {/* ID Upload */}
                <div>
                  <p style={{ fontWeight: 700, marginBottom: '0.8rem', fontSize: '0.9rem' }}>{t.idUpload}</p>
                  <div className={`upload-zone ${idUploaded ? 'drag' : ''}`} onClick={() => setIdUploaded(true)}>
                    {idUploaded ? (
                      <div>
                        <div style={{ marginBottom: '0.5rem' }} ><LucideIcon name="check-circle-2" size={36} color="var(--green)" /></div>
                        <p style={{ color: 'var(--green)', fontWeight: 700 }}>{lang === 'ar' ? 'تم التحميل' : 'Uploaded'}</p>
                      </div>
                    ) : (
                      <div>
                        <div style={{ marginBottom: '0.5rem' }} ><LucideIcon name="id-card" size={36} color="#1B6B93" /></div>
                        <p style={{ fontWeight: 700, marginBottom: '0.3rem', fontSize: '0.88rem' }}>{lang === 'ar' ? 'انقر لالتقاط صورة البطاقة' : 'Click to capture ID photo'}</p>
                        <p style={{ fontSize: '0.75rem', color: 'var(--text-mid)' }}>{lang === 'ar' ? 'تأكد من وضوح الصورة' : 'Ensure image is clear'}</p>
                      </div>
                    )}
                  </div>
                </div>
                {/* Selfie */}
                <div>
                  <p style={{ fontWeight: 700, marginBottom: '0.8rem', fontSize: '0.9rem' }}>{t.selfieTitle}</p>
                  <div style={{ textAlign: 'center', padding: '1rem 0' }}>
                    <div className="selfie-circle" onClick={handleSelfie} style={{ cursor: 'pointer' }}>
                      <div className="selfie-pulse" />
                      {loading ? <div className="spinner" style={{ width: 50, height: 50 }} /> :
                        selfieReady ? <LucideIcon name="check" size={28} color="#fff" /> : <LucideIcon name="camera" size={28} color="#fff" />}
                    </div>
                    <p style={{ fontSize: '0.78rem', color: 'var(--text-mid)' }}>{t.selfieHint}</p>
                    {selfieReady && <p style={{ color: 'var(--green)', fontWeight: 700, fontSize: '0.82rem', marginTop: '0.3rem', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '0.3rem' }}><LucideIcon name="shield-check" size={14} color="var(--green)" /> {lang === 'ar' ? 'تم التحقق بنجاح' : 'Verified successfully'}</p>}
                  </div>
                </div>
              </div>
              <div style={{ display: 'flex', gap: '0.8rem', marginTop: '1.5rem' }}>
                <button onClick={() => setStep(1)} style={{ flex: 1, padding: '0.75rem', background: 'transparent', border: '1.5px solid #e2e8f0', borderRadius: '10px', fontFamily: 'Cairo', fontWeight: 700, cursor: 'pointer', color: 'var(--text-mid)' }}>
                  {lang === 'ar' ? '← رجوع' : '← Back'}
                </button>
                <button className="btn-gold" style={{ flex: 2 }} onClick={() => setStep(3)} disabled={!idUploaded || !selfieReady}>
                  {lang === 'ar' ? 'التالي ←' : 'Next →'}
                </button>
              </div>
            </div>
          )}

          {/* STEP 3 */}
          {step === 3 && (
            <div>
              <h3 style={{ fontWeight: 800, marginBottom: '0.3rem', fontSize: '1.2rem' }}>{t.s3title}</h3>
              <p style={{ color: 'var(--text-mid)', fontSize: '0.85rem', marginBottom: '1.8rem' }}>
                {lang === 'ar' ? 'أكمل بياناتك لإنشاء حسابك' : 'Complete your details to create your account'}
              </p>
              <div className="grid-2" style={{ marginBottom: '1rem' }}>
                <div>
                  <label className="form-label">{t.nameLbl}</label>
                  <input className="form-input" value={fullName} onChange={e => setFullName(e.target.value)} placeholder={lang === 'ar' ? 'فاطمة أحمد' : 'Fatma Ahmed'} />
                </div>
                <div>
                  <label className="form-label">{t.phoneLbl}</label>
                  <input className="form-input" value={phone} onChange={e => setPhone(e.target.value)} placeholder="010XXXXXXXX" />
                </div>
              </div>
              <div style={{ marginBottom: '1rem' }}>
                <label className="form-label">{t.govLbl}</label>
                <select className="form-select" value={governate} onChange={e => setGovernate(e.target.value)}>
                  <option value="">{lang === 'ar' ? 'اختر محافظتك' : 'Select your governate'}</option>
                  {GOVS.map((g, i) => <option key={i} value={g}>{lang === 'ar' ? g : GOVS_EN[i]}</option>)}
                </select>
              </div>
              <div className="grid-2">
                <div>
                  <label className="form-label">{t.passLbl}</label>
                  <input className="form-input" type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="••••••••" />
                </div>
                <div>
                  <label className="form-label">{t.confirmLbl}</label>
                  <input className={`form-input ${confirmPass && confirmPass !== password ? 'error' : ''}`} type="password" value={confirmPass} onChange={e => setConfirmPass(e.target.value)} placeholder="••••••••" />
                </div>
              </div>
              <div style={{ display: 'flex', gap: '0.8rem', marginTop: '1.5rem' }}>
                <button onClick={() => setStep(2)} style={{ flex: 1, padding: '0.75rem', background: 'transparent', border: '1.5px solid #e2e8f0', borderRadius: '10px', fontFamily: 'Cairo', fontWeight: 700, cursor: 'pointer', color: 'var(--text-mid)' }}>
                  {lang === 'ar' ? '← رجوع' : '← Back'}
                </button>
                <button className="btn-gold" style={{ flex: 2 }} onClick={() => setStep(4)} disabled={!fullName || !governate || !password || password !== confirmPass}>
                  {lang === 'ar' ? 'التالي ←' : 'Next →'}
                </button>
              </div>
            </div>
          )}

          {/* STEP 4 — Review */}
          {step === 4 && (
            <div>
              <h3 style={{ fontWeight: 800, marginBottom: '0.3rem', fontSize: '1.2rem' }}>{t.s4title}</h3>
              <p style={{ color: 'var(--text-mid)', fontSize: '0.85rem', marginBottom: '1.8rem' }}>
                {lang === 'ar' ? 'تأكد من صحة بياناتك قبل الإرسال' : 'Verify your information before submitting'}
              </p>
              <div style={{ background: 'var(--papyrus)', borderRadius: '12px', padding: '1.2rem', marginBottom: '1.2rem' }}>
                {[
                  [lang === 'ar' ? 'الرقم القومي' : 'National ID', nationalId.replace(/(\d{4})(\d{6})(\d{4})/, '$1-$2-$3')],
                  [lang === 'ar' ? 'الاسم الكامل' : 'Full Name', fullName],
                  [lang === 'ar' ? 'الهاتف' : 'Phone', phone],
                  [lang === 'ar' ? 'المحافظة' : 'Governate', governate],
                  [lang === 'ar' ? 'التحقق من الهوية' : 'ID Verification', (lang === 'ar' ? 'تم التحقق' : 'Verified')],
                  [lang === 'ar' ? 'الصورة الشخصية' : 'Selfie', (lang === 'ar' ? 'تم التحقق' : 'Verified')],
                ].map(([label, value], i) => (
                  <div key={i} className="review-row">
                    <span className="review-label">{label}</span>
                    <span className="review-value" style={{ fontFamily: i === 0 ? 'JetBrains Mono, monospace' : 'inherit' }}>{value}</span>
                  </div>
                ))}
              </div>
              <label className="checkbox-wrap" style={{ marginBottom: '1.5rem' }}>
                <input type="checkbox" className="checkbox-input" id="agree" />
                <span className="checkbox-text">{t.confirm}</span>
              </label>
              <div style={{ display: 'flex', gap: '0.8rem' }}>
                <button onClick={() => setStep(3)} style={{ flex: 1, padding: '0.75rem', background: 'transparent', border: '1.5px solid #e2e8f0', borderRadius: '10px', fontFamily: 'Cairo', fontWeight: 700, cursor: 'pointer', color: 'var(--text-mid)' }}>
                  {lang === 'ar' ? '← رجوع' : '← Back'}
                </button>
                <button className="btn-gold" style={{ flex: 2 }} onClick={handleSubmit}>
                  {loading ? <span className="spinner" style={{ width: 20, height: 20, display: 'inline-block', borderWidth: 2 }} /> : t.submit}
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── COMPLAINT SUBMISSION ───
function SubmitPage({ setPage, lang }) {
  const [step, setStep] = useState(1);
  const [locationPinned, setLocationPinned] = useState(false);
  const [selectedCategory, setSelectedCategory] = useState('');
  const [categorySearch, setCategorySearch] = useState('');
  const [description, setDescription] = useState('');
  const [sentiment, setSentiment] = useState('none');
  const [evidence, setEvidence] = useState([]);
  const [isRecording, setIsRecording] = useState(false);
  const [loading, setLoading] = useState(false);
  const [done, setDone] = useState(false);
  const [refNum, setRefNum] = useState('');
  const [duplicateWarning, setDuplicateWarning] = useState(false);

  useEffect(() => {
    setSentiment(getSentiment(description));
    if (description.length > 30 && Math.random() > 0.6) setDuplicateWarning(true);
    else setDuplicateWarning(false);
  }, [description]);

  const handleVoice = () => {
    setIsRecording(r => !r);
    if (!isRecording) {
      setTimeout(() => {
        setDescription(prev => prev + (lang === 'ar' ? ' الشارع مظلم تماماً منذ أسبوعين ولا توجد إنارة على الإطلاق' : ' The street has been completely dark for two weeks with no lighting at all'));
        setIsRecording(false);
      }, 3000);
    }
  };

  const addEvidence = (emoji) => {
    if (evidence.length < 5) setEvidence(prev => [...prev, emoji]);
  };

  const submit = () => {
    setLoading(true);
    setTimeout(() => {
      setLoading(false);
      setRefNum('SHK-2024-' + String(Math.floor(Math.random() * 9000) + 1000));
      setDone(true);
    }, 2000);
  };

  const sentDisp = getSentimentDisplay(sentiment, lang);

  const cats = lang === 'ar' ? CATEGORIES : CATEGORIES_EN;
  const filteredCats = cats.filter(c => c.toLowerCase().includes(categorySearch.toLowerCase()));

  const STEPS = lang === 'ar' ? ['الموقع', 'الفئة', 'التفاصيل', 'الأدلة', 'مراجعة'] : ['Location', 'Category', 'Details', 'Evidence', 'Review'];

  if (done) return (
    <div className="page" style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', minHeight: '100vh', background: 'var(--papyrus)', padding: '2rem' }}>
      <div style={{ textAlign: 'center', maxWidth: 480 }}>
        <div style={{ marginBottom: '1.5rem', display: 'flex', justifyContent: 'center' }}><div style={{ width: 80, height: 80, borderRadius: '50%', background: 'linear-gradient(135deg, var(--green), var(--green-light))', display: 'flex', alignItems: 'center', justifyContent: 'center' }} ><LucideIcon name="check-circle-2" size={40} color="#fff" /></div></div>
        <h2 style={{ fontSize: '1.8rem', fontWeight: 900, marginBottom: '0.5rem' }}>
          {lang === 'ar' ? 'تم إرسال شكواك بنجاح!' : 'Complaint Submitted Successfully!'}
        </h2>
        <p style={{ color: 'var(--text-mid)', marginBottom: '1rem' }}>
          {lang === 'ar' ? 'رقم متابعتك:' : 'Your tracking number:'}
        </p>
        <div style={{ background: 'var(--dark)', color: 'var(--gold)', fontFamily: 'JetBrains Mono, monospace', fontSize: '1.4rem', fontWeight: 700, padding: '1rem 2rem', borderRadius: '12px', marginBottom: '2rem', letterSpacing: '2px' }}>
          {refNum}
        </div>
        <div className="alert alert-success" style={{ textAlign: 'right' }}>
          <LucideIcon name="rocket" size={16} color="var(--green)" />
          <span>{lang === 'ar' ? 'شكواك ستُعالج خلال 48 ساعة. ستصلك إشعارات بكل تحديث.' : 'Your complaint will be processed within 48 hours. You\'ll receive notifications for every update.'}</span>
        </div>
        <div style={{ display: 'flex', gap: '0.8rem', marginTop: '1.5rem' }}>
          <button className="btn-gold" style={{ flex: 1 }} onClick={() => setPage('dashboard')}>
            {lang === 'ar' ? 'تابع شكواي ←' : 'Track My Complaint →'}
          </button>
          <button onClick={() => { setStep(1); setDone(false); setDescription(''); setEvidence([]); setSelectedCategory(''); setLocationPinned(false); }}
            style={{ flex: 1, padding: '0.9rem', background: 'transparent', border: '1.5px solid var(--nile)', borderRadius: '12px', fontFamily: 'Cairo', fontWeight: 700, cursor: 'pointer', color: 'var(--nile)' }}>
            {lang === 'ar' ? '+ شكوى جديدة' : '+ New Complaint'}
          </button>
        </div>
      </div>
    </div>
  );

  return (
    <div className="page page-transition" style={{ background: 'var(--sand)', padding: '2rem', minHeight: '100vh' }}>
      <div style={{ maxWidth: 680, margin: '2rem auto' }}>
        <h2 style={{ fontSize: '1.6rem', fontWeight: 900, marginBottom: '0.3rem' }}>
          {lang === 'ar' ? 'تقديم شكوى جديدة' : 'Submit New Complaint'}
        </h2>
        <p style={{ color: 'var(--text-mid)', marginBottom: '2rem', fontSize: '0.9rem' }}>
          {lang === 'ar' ? 'الخطوة ' + step + ' من 5' : `Step ${step} of 5`}
        </p>

        {/* Progress */}
        <div style={{ marginBottom: '2rem' }}>
          <div className="progress-wrap">
            <div className="progress-fill" style={{ width: `${(step / 5) * 100}%`, background: `linear-gradient(90deg, var(--nile), var(--gold))` }} />
          </div>
          <div className="steps-bar" style={{ marginTop: '0.8rem' }}>
            {STEPS.map((s, i) => (
              <React.Fragment key={i}>
                <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '0.2rem' }}>
                  <div className={`step-dot ${i + 1 < step ? 'done' : i + 1 === step ? 'active' : 'pending'}`} style={{ width: 28, height: 28, fontSize: '0.75rem' }}>
                    {i + 1 < step ? <LucideIcon name="check" size={14} color="#fff" /> : i + 1}
                  </div>
                  <span style={{ fontSize: '0.62rem', color: i + 1 === step ? 'var(--nile)' : '#94a3b8', fontWeight: 600, whiteSpace: 'nowrap' }}>{s}</span>
                </div>
                {i < STEPS.length - 1 && <div className={`step-line ${i + 1 < step ? 'done' : ''}`} />}
              </React.Fragment>
            ))}
          </div>
        </div>

        <div className="form-card">
          {/* STEP 1: Location */}
          {step === 1 && (
            <div>
              <h3 style={{ fontWeight: 800, marginBottom: '0.3rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}><LucideIcon name="map-pin" size={17} color="#1B6B93" />{lang === 'ar' ? 'تحديد الموقع' : 'Select Location'}</h3>
              <p style={{ color: 'var(--text-mid)', fontSize: '0.85rem', marginBottom: '1.5rem' }}>{lang === 'ar' ? 'حدد مكان المشكلة على الخريطة أو أدخل العنوان' : 'Pin the location of the issue on the map or enter the address'}</p>
              <div className="map-placeholder" onClick={() => setLocationPinned(true)}>
                <div className="map-grid" />
                <div className="map-pin">{locationPinned ? <LucideIcon name="map-pin" size={32} color="var(--gold)" /> : <LucideIcon name="map" size={32} color="var(--nile-light)" />}</div>
                <p style={{ color: locationPinned ? 'var(--gold)' : '#64748b', fontWeight: 700, zIndex: 1, marginTop: '0.5rem', fontSize: '0.88rem' }}>
                  {locationPinned ? (lang === 'ar' ? 'تم تحديد الموقع — شارع التحرير، القاهرة' : 'Location pinned — Tahrir St., Cairo') : (lang === 'ar' ? 'انقر لتحديد الموقع' : 'Click to pin location')}
                </p>
              </div>
              <div style={{ display: 'flex', gap: '0.8rem', marginTop: '1rem', alignItems: 'center' }}>
                <input className="form-input" style={{ flex: 1 }} placeholder={lang === 'ar' ? 'أو اكتب العنوان هنا...' : 'Or type address here...'} />
                <button style={{ padding: '0.75rem 1.2rem', background: 'var(--nile)', color: '#fff', border: 'none', borderRadius: '10px', fontFamily: 'Cairo', fontWeight: 700, cursor: 'pointer', whiteSpace: 'nowrap', fontSize: '0.85rem' }} onClick={() => setLocationPinned(true)}>
                  {lang === 'ar' ? 'موقعي' : 'My Location'}
                </button>
              </div>
              <button className="btn-gold" style={{ width: '100%', marginTop: '1.5rem' }} onClick={() => setStep(2)} disabled={!locationPinned}>
                {lang === 'ar' ? 'التالي ←' : 'Next →'}
              </button>
            </div>
          )}

          {/* STEP 2: Category */}
          {step === 2 && (
            <div>
              <h3 style={{ fontWeight: 800, marginBottom: '0.3rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}><LucideIcon name="tag" size={17} color="#1B6B93" />{lang === 'ar' ? 'نوع المشكلة' : 'Complaint Category'}</h3>
              <p style={{ color: 'var(--text-mid)', fontSize: '0.85rem', marginBottom: '1.5rem' }}>{lang === 'ar' ? 'اكتب لتصفية الفئات أو اختر مباشرة — الذكاء الاصطناعي سيساعدك!' : 'Type to filter or select directly — AI will help you!'}</p>
              <input className="form-input" value={categorySearch} onChange={e => setCategorySearch(e.target.value)} placeholder={lang === 'ar' ? 'ابحث عن فئة... (مثال: كهرباء)' : 'Search category... (e.g. electricity)'} />
              <div className="chips-wrap">
                {filteredCats.map((c, i) => (
                  <div key={i} className={`chip ${selectedCategory === c ? 'selected' : 'default'}`} onClick={() => setSelectedCategory(c)}>{c}</div>
                ))}
              </div>
              {selectedCategory && (
                <div className="alert alert-success" style={{ marginTop: '1rem' }}>
                  <LucideIcon name="sparkles" size={16} color="var(--green)" />
                  <span>{lang === 'ar' ? `الذكاء الاصطناعي اقترح: "${selectedCategory}" — هل هذا صحيح؟` : `AI Suggested: "${selectedCategory}" — Is this correct?`}</span>
                </div>
              )}
              <div style={{ display: 'flex', gap: '0.8rem', marginTop: '1.5rem' }}>
                <button onClick={() => setStep(1)} style={{ flex: 1, padding: '0.75rem', background: 'transparent', border: '1.5px solid #e2e8f0', borderRadius: '10px', fontFamily: 'Cairo', fontWeight: 700, cursor: 'pointer', color: 'var(--text-mid)' }}>
                  {lang === 'ar' ? '← رجوع' : '← Back'}
                </button>
                <button className="btn-gold" style={{ flex: 2 }} onClick={() => setStep(3)} disabled={!selectedCategory}>
                  {lang === 'ar' ? 'التالي ←' : 'Next →'}
                </button>
              </div>
            </div>
          )}

          {/* STEP 3: Details */}
          {step === 3 && (
            <div>
              <h3 style={{ fontWeight: 800, marginBottom: '0.3rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}><LucideIcon name="pencil-line" size={17} color="#1B6B93" />{lang === 'ar' ? 'وصف المشكلة' : 'Describe the Problem'}</h3>
              <p style={{ color: 'var(--text-mid)', fontSize: '0.85rem', marginBottom: '1.5rem' }}>{lang === 'ar' ? 'كلما كانت التفاصيل أكثر، كانت المعالجة أسرع' : 'More details = faster processing'}</p>
              <div style={{ display: 'flex', gap: '0.5rem', alignItems: 'flex-start' }}>
                <textarea
                  className="form-textarea"
                  value={description}
                  onChange={e => setDescription(e.target.value)}
                  placeholder={lang === 'ar' ? 'صف المشكلة بالتفصيل... (الحد الأدنى 10 أحرف)' : 'Describe the problem in detail... (minimum 10 characters)'}
                  style={{ flex: 1 }}
                />
                <button className={`voice-btn ${isRecording ? 'recording' : ''}`} onClick={handleVoice} title={lang === 'ar' ? 'إدخال صوتي' : 'Voice Input'}>
                  {isRecording ? <LucideIcon name="square" size={16} color="#fff" /> : <LucideIcon name="mic" size={16} color="#fff" />}
                </button>
              </div>
              <div style={{ display: 'flex', justify: 'space-between', marginTop: '0.3rem' }}>
                <span style={{ fontSize: '0.75rem', color: '#94a3b8' }}>{description.length}/1000</span>
                {isRecording && <span style={{ fontSize: '0.75rem', color: 'var(--red)', fontWeight: 700, animation: 'pulse 1s infinite' }}>⏺ {lang === 'ar' ? 'جارٍ التسجيل...' : 'Recording...'}</span>}
              </div>

              {/* Real-time sentiment */}
              {description.length > 0 && (
                <div className="sentiment-bar">
                  <span className="sentiment-emoji"><span><LucideIcon name={sentDisp.icon} size={22} color={sentDisp.color} /></span></span>
                  <div>
                    <p style={{ fontSize: '0.72rem', color: 'var(--text-mid)', fontWeight: 600 }}>{lang === 'ar' ? 'نبرة الشكوى' : 'Complaint Tone'}</p>
                    <p className="sentiment-label" style={{ color: sentDisp.color }}>{sentDisp.label}</p>
                  </div>
                </div>
              )}

              {/* Duplicate warning */}
              {duplicateWarning && (
                <div className="alert alert-warning">
                  <LucideIcon name="triangle-alert" size={16} color="#b07d0f" />
                  <span>{lang === 'ar' ? '34 شخصاً أبلغوا عن مشكلة مماثلة في منطقتك — شكواك ستُضاف لمجموعة الشكاوى لتسريع المعالجة' : '34 people reported a similar issue in your area — your complaint will be grouped for faster processing'}</span>

              )}

              <div style={{ display: 'flex', gap: '0.8rem', marginTop: '1.5rem' }}>
                <button onClick={() => setStep(2)} style={{ flex: 1, padding: '0.75rem', background: 'transparent', border: '1.5px solid #e2e8f0', borderRadius: '10px', fontFamily: 'Cairo', fontWeight: 700, cursor: 'pointer', color: 'var(--text-mid)' }}>
                  {lang === 'ar' ? '← رجوع' : '← Back'}
                </button>
                <button className="btn-gold" style={{ flex: 2 }} onClick={() => setStep(4)} disabled={description.length < 10}>
                  {lang === 'ar' ? 'التالي ←' : 'Next →'}
                </button>
              </div>
            </div>
          )}

          {/* STEP 4: Evidence */}
          {step === 4 && (
            <div>
              <h3 style={{ fontWeight: 800, marginBottom: '0.3rem' }}>{lang === 'ar' ? 'إضافة الأدلة (اختياري)' : 'Add Evidence (Optional)'}</h3>

              <div
                className="upload-zone"
                onDragOver={e => e.preventDefault()}
                onClick={() => addEvidence(['photo', 'video', 'photo'][Math.floor(Math.random() * 3)])}
              >
                <div style={{ marginBottom: '0.5rem' }} ><LucideIcon name="folder-up" size={36} color="#1B6B93" /></div>

              </div>
              {evidence.length > 0 && (
                <div className="evidence-gallery">
                  {evidence.map((e, i) => (
                    <div key={i} className="evidence-thumb">
                      {e}
                      <button className="remove-btn" onClick={() => setEvidence(prev => prev.filter((_, j) => j !== i))}>×</button>
                    </div>
                  ))}
                </div>
              )}
              <p style={{ fontSize: '0.78rem', color: 'var(--text-mid)', marginTop: '0.8rem' }}>
                {evidence.length}/5 {lang === 'ar' ? 'ملفات' : 'files'}
              </p>
              <div style={{ display: 'flex', gap: '0.8rem', marginTop: '1.5rem' }}>
                <button onClick={() => setStep(3)} style={{ flex: 1, padding: '0.75rem', background: 'transparent', border: '1.5px solid #e2e8f0', borderRadius: '10px', fontFamily: 'Cairo', fontWeight: 700, cursor: 'pointer', color: 'var(--text-mid)' }}>
                  {lang === 'ar' ? '← رجوع' : '← Back'}
                </button>
                <button className="btn-gold" style={{ flex: 2 }} onClick={() => setStep(5)}>
                  {lang === 'ar' ? 'التالي ←' : 'Next →'}
                </button>
              </div>
            </div>
          )}

          {/* STEP 5: Review */}
          {step === 5 && (
            <div>
              <h3 style={{ fontWeight: 800, marginBottom: '0.3rem', display: 'flex', alignItems: 'center', gap: '0.5rem' }}><LucideIcon name="check-circle-2" size={17} color="#1B6B93" />{lang === 'ar' ? 'مراجعة وتأكيد' : 'Review & Confirm'}</h3>
              <p style={{ color: 'var(--text-mid)', fontSize: '0.85rem', marginBottom: '1.5rem' }}>{lang === 'ar' ? 'راجع بياناتك قبل الإرسال النهائي' : 'Review your data before final submission'}</p>
              <div style={{ background: 'var(--papyrus)', borderRadius: '12px', padding: '1.2rem', marginBottom: '1.2rem' }}>
                {[
                  [lang === 'ar' ? 'الموقع' : 'Location', lang === 'ar' ? 'شارع التحرير، القاهرة' : 'Tahrir St., Cairo'],
                  [lang === 'ar' ? 'الفئة' : 'Category', selectedCategory],
                  [lang === 'ar' ? 'نبرة الشكوى' : 'Sentiment', sentDisp.emoji + ' ' + sentDisp.label],
                  [lang === 'ar' ? 'الأدلة' : 'Evidence', evidence.length + (lang === 'ar' ? ' ملفات' : ' files')],
                  [lang === 'ar' ? 'وصف المشكلة' : 'Description', description.slice(0, 80) + (description.length > 80 ? '...' : '')],
                ].map(([label, value], i) => (
                  <div key={i} className="review-row">
                    <span className="review-label">{label}</span>
                    <span className="review-value">{value}</span>
                  </div>
                ))}
              </div>
              <label className="checkbox-wrap" style={{ marginBottom: '1.5rem' }}>
                <input type="checkbox" className="checkbox-input" id="confirm-submit" />
                <span className="checkbox-text">{lang === 'ar' ? 'أقر بصحة المعلومات وأنها لا تحتوي على بيانات مضللة' : 'I certify the information is accurate and contains no misleading data'}</span>
              </label>
              <div style={{ display: 'flex', gap: '0.8rem' }}>
                <button onClick={() => setStep(4)} style={{ flex: 1, padding: '0.75rem', background: 'transparent', border: '1.5px solid #e2e8f0', borderRadius: '10px', fontFamily: 'Cairo', fontWeight: 700, cursor: 'pointer', color: 'var(--text-mid)' }}>
                  {lang === 'ar' ? '← رجوع' : '← Back'}
                </button>
                <button className="btn-gold" style={{ flex: 2, fontSize: '1rem' }} onClick={submit}>
                  {loading ? <span className='spinner' style={{ width: 20, height: 20, display: 'inline-block', borderWidth: 2 }} /> : <span style={{ display: 'inline-flex', alignItems: 'center', gap: '0.5rem' }}><LucideIcon name="send" size={16} color="#1a1a1a" />{lang === 'ar' ? 'إرسال الشكوى' : 'Submit Complaint'}</span>}
                </button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>

          {/* Egypt Map + Priority Queue */}
          <div className="charts-grid">
            {/* Map */}
            <div className="chart-card">
              <div className="chart-title">{lang === 'ar' ? 'خريطة الكثافة — مصر' : 'Density Map — Egypt'}</div>
              <div className="egypt-map">
                <div style={{ color: '#475569', fontSize: '0.82rem', position: 'absolute', top: '0.8rem', left: '0.8rem', background: 'rgba(0,0,0,0.3)', padding: '0.3rem 0.6rem', borderRadius: '6px' }}>
                  {lang === 'ar' ? 'انقر محافظة للفلترة' : 'Click governate to filter'}
                </div>
                {/* Heat dots */}
                {[
                  { x: '48%', y: '28%', size: 80 }, // Cairo
                  { x: '44%', y: '30%', size: 60 }, // Giza
                  { x: '25%', y: '20%', size: 50 }, // Alex
                  { x: '55%', y: '35%', size: 40 }, // Mansoura
                  { x: '50%', y: '45%', size: 30 }, // Assiut
                  { x: '52%', y: '55%', size: 20 }, // Luxor
                ].map((d, i) => (
                  <div key={i} className="map-heat-dot" style={{ left: d.x, top: d.y, width: d.size, height: d.size, transform: 'translate(-50%,-50%)' }} />
                ))}
                <div style={{ opacity: 0.15 }} ><LucideIcon name="map" size={48} color="#64748b" /></div>
                <p style={{ color: '#475569', fontSize: '0.8rem', position: 'absolute', bottom: '0.8rem' }}>
                  {lang === 'ar' ? 'القاهرة: 247 شكوى | الجيزة: 128 | الإسكندرية: 94' : 'Cairo: 247 | Giza: 128 | Alexandria: 94'}
                </p>
              </div>
            </div>

            {/* Trend sparkline (simple) */}
            <div className="chart-card">
              <div className="chart-title">{lang === 'ar' ? 'اتجاهات آخر 30 يوم' : 'Trends — Last 30 Days'}</div>
              <svg viewBox="0 0 300 100" style={{ width: '100%', height: 110 }}>
                <defs>
                  <linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#1B6B93" stopOpacity="0.4" />
                    <stop offset="100%" stopColor="#1B6B93" stopOpacity="0" />
                  </linearGradient>
                </defs>
                <path d="M0,80 L30,65 L60,70 L90,50 L120,55 L150,35 L180,40 L210,25 L240,30 L270,15 L300,20" fill="none" stroke="#1B6B93" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" />
                <path d="M0,80 L30,65 L60,70 L90,50 L120,55 L150,35 L180,40 L210,25 L240,30 L270,15 L300,20 L300,100 L0,100 Z" fill="url(#trendGrad)" />
                <path d="M0,90 L30,82 L60,85 L90,75 L120,72 L150,65 L180,68 L210,60 L240,62 L270,55 L300,58" fill="none" stroke="#D4AF37" strokeWidth="1.5" strokeDasharray="4,2" />
                <circle cx="270" cy="15" r="4" fill="#1B6B93" />
                <circle cx="270" cy="55" r="3" fill="#D4AF37" />
              </svg>
              <div style={{ display: 'flex', gap: '1.2rem', marginTop: '0.5rem' }}>
                <div className="legend-item"><div className="legend-dot" style={{ background: '#1B6B93' }} /><span style={{ fontSize: '0.75rem', color: '#94a3b8' }}>{lang === 'ar' ? 'الشكاوى' : 'Complaints'}</span></div>
                <div className="legend-item"><div className="legend-dot" style={{ background: '#D4AF37' }} /><span style={{ fontSize: '0.75rem', color: '#94a3b8' }}>{lang === 'ar' ? 'المحلولة' : 'Resolved'}</span></div>
              </div>
            </div>
          </div>

          {/* Priority Queue */}
          <div className="chart-card" style={{ background: 'var(--dark2)' }}>
            <div className="chart-title" style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
              <LucideIcon name="circle" size={12} color="var(--red)" style={{ animation: 'pulse 1.5s infinite' }} />
              {lang === 'ar' ? 'الشكاوى ذات الأولوية القصوى' : 'Top Priority Complaints'}
            </div>
            {priorityQueue.map((p, i) => (
              <div key={i} className="priority-card">
                <div className="priority-score" style={{ background: p.color + '20', color: p.color, fontFamily: 'JetBrains Mono, monospace' }}>
                  {p.score}
                </div>
                <div className="priority-content">
                  <div className="priority-title">{p.title}</div>
                  <div className="priority-meta" style={{ display: 'flex', alignItems: 'center', gap: '0.35rem', flexWrap: 'wrap' }}><LucideIcon name="map-pin" size={13} color="#64748b" />{p.location}<span style={{ opacity: 0.5 }}>·</span><LucideIcon name="tag" size={13} color="#64748b" />{p.cat}</div>
                </div>
                <div className="priority-thumb">{i % 2 === 0 ? <LucideIcon name="camera" size={20} color="#64748b" /> : <LucideIcon name="video" size={20} color="#64748b" />}</div>
                <button style={{ padding: '0.4rem 0.8rem', background: 'var(--nile)', border: 'none', borderRadius: '8px', color: '#fff', fontFamily: 'Cairo', fontSize: '0.75rem', fontWeight: 700, cursor: 'pointer', whiteSpace: 'nowrap', flexShrink: 0 }}>
                  {lang === 'ar' ? 'تعيين ←' : 'Assign →'}
                </button>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── APP ROOT ───
function App() {
  const [page, setPage] = useState('home');
  const [lang, setLang] = useState('ar');

  const renderPage = () => {
    switch(page) {
      case 'home': return <HomePage setPage={setPage} lang={lang} />;
      case 'register': return <RegisterPage setPage={setPage} lang={lang} />;
      case 'submit': return <SubmitPage setPage={setPage} lang={lang} />;
      case 'dashboard': return <DashboardPage setPage={setPage} lang={lang} />;
      case 'admin': return <AdminPage lang={lang} />;
      default: return <HomePage setPage={setPage} lang={lang} />;
    }
  };

  return (
    <div dir={lang === 'ar' ? 'rtl' : 'ltr'}>
      <Navbar page={page} setPage={setPage} lang={lang} setLang={setLang} />
      {renderPage()}
    </div>
  );
}

const __root = ReactDOM.createRoot(document.getElementById('root'));
__root.render(<App />);
</script>
</body>
</html>
